    }
  }
  function openShop() {
    if (shopOpen || !gameActive) return;
    shopOpen = true;
    gameActive = false; // 移动/射击/敌人 AI 都已经在各自的 update 函数里判断 gameActive，直接借用来暂停
    mouseFiring = false;
    touchFiring = false;
    touchFiringLeft = false;
    touchFiringRight = false;
    refreshShopSelection();
    shopPanel.classList.add("show");
    if (!isTouch && document.pointerLockElement === canvas) document.exitPointerLock();
  }
  function closeShop() {
    if (!shopOpen) return;
    shopOpen = false;
    shopPanel.classList.remove("show");
    gameActive = true;
    if (!isTouch) canvas.requestPointerLock();
  }
  shopBtn.addEventListener("click", openShop);
  shopBtn.addEventListener("touchstart", function (ev) { ev.preventDefault(); openShop(); }, { passive: false });
  shopCloseBtn.addEventListener("click", closeShop);
  shopCloseBtn.addEventListener("touchstart", function (ev) { ev.preventDefault(); closeShop(); }, { passive: false });
  var shopWeaponCards = shopPanel.querySelectorAll(".weapon-card");
  for (var __swc = 0; __swc < shopWeaponCards.length; __swc++) {
    (function (card) {
      function pick(ev) {
        if (ev) ev.preventDefault();
        applyWeapon(card.getAttribute("data-weapon"));
        refreshShopSelection();
      }
      card.addEventListener("click", pick);
      card.addEventListener("touchstart", pick, { passive: false });
    })(shopWeaponCards[__swc]);
  }
  var skinSwatchEls = shopPanel.querySelectorAll(".skin-swatch");
  for (var __sk = 0; __sk < skinSwatchEls.length; __sk++) {
    (function (el) {
      function pick(ev) {
        if (ev) ev.preventDefault();
        applySkin(el.getAttribute("data-skin"));
        refreshShopSelection();
      }
      el.addEventListener("click", pick);
      el.addEventListener("touchstart", pick, { passive: false });
    })(skinSwatchEls[__sk]);
  }

  startBtn.addEventListener("click", function () {
    ensureAudio();
    tryLockLandscape();
    if (isTouch) enterGame();
    else canvas.requestPointerLock();
  });
  overlay.addEventListener("click", function (ev) {
    if (isTouch || ev.target === startBtn) return;
    ensureAudio();
    canvas.requestPointerLock();
  });
  document.addEventListener("pointerlockchange", function () {
    // 打开局内商店时会主动 exitPointerLock 以便鼠标能点面板按钮，这个由 openShop 触发的
    // "解锁"不该被当成玩家按 ESC 退出游戏处理，不然商店面板前脚弹出后脚就被 exitGame 关掉；
    // 关闭商店时同理，重新拿锁不需要再跑一遍 enterGame 的敌人计时重置逻辑
    if (document.pointerLockElement === canvas) { if (!shopOpen) enterGame(); }
    else { if (!shopOpen) exitGame(); }
  });
  document.addEventListener("mousemove", function (ev) {
    if (document.pointerLockElement !== canvas) return;
    // 视角越窄（开镜时）同样的鼠标位移在画面里划过的角度越大，灵敏度要跟着 FOV 等比缩小，
    // 不然一开镜镜头就变得极其敏感，很难稳住准星
    // 开镜时按 FOV 等比缩小灵敏度会让画面更好稳住，但线性缩到底（倍镜 FOV 只有基础值的三成左右）
    // 会让转向慢到几乎感觉不到在动，像是"转不动"——给缩放比例设一个下限，开镜也能正常转头
    var s = 0.0022 * Math.max(camera.fov / BASE_FOV, 0.45);
    yaw -= (ev.movementX || 0) * s;
    pitch -= (ev.movementY || 0) * s;
    pitch = Math.max(-PITCH_LIM, Math.min(PITCH_LIM, pitch));
  });

  var mouseFiring = false;
  document.addEventListener("mousedown", function (ev) {
    if (ev.button !== 0 || isTouch || document.pointerLockElement !== canvas) return;
    mouseFiring = true;
    shoot();
  });
  document.addEventListener("mouseup", function (ev) {
    if (ev.button !== 0) return;
    mouseFiring = false;
  });
  window.addEventListener("blur", function () { mouseFiring = false; touchFiring = false; setScoped(false); });

  window.addEventListener("keydown", function (ev) {
    keys[ev.code] = true;
    if (ev.code === "KeyR") startReload();
    if (ev.code === "KeyV") toggleViewMode();
    if (ev.code === "Space") { tryJump(); ev.preventDefault(); }
  });
  window.addEventListener("keyup", function (ev) { keys[ev.code] = false; });
  var keys = {};

  /* ---------------- 结局：通关 / 阵亡 ---------------- */
  function endGame(won) {
    gameActive = false;
    mouseFiring = false; touchFiring = false;
    reticle.classList.remove("visible");
    hud.classList.remove("visible");
    hpBarWrapEl.classList.remove("visible");
    touchLayer.classList.add("hidden");

    if (won) {
      endScreen.classList.remove("lose");
      endEyebrow.textContent = "行动成功";
      endTitle.textContent = "全部歼灭";
      finalScoreSub.textContent = "击杀数";
      playVictory();
    } else {
      endScreen.classList.add("lose");
      endEyebrow.textContent = "阵地失守";
      endTitle.textContent = "阵亡";
      finalScoreSub.textContent = "阵亡前击杀数";
      playDefeat();
    }
    finalScoreEl.textContent = String(score);
    endScreen.classList.remove("hidden");
    if (!isTouch && document.pointerLockElement === canvas) document.exitPointerLock();
  }

  function resetGame() {
    score = 0;
    scoreEl.textContent = 0;
    playerHP = PLAYER_MAX_HP;
    updateHpUI();
    currentAmmo = MAG_SIZE;
    isReloading = false;
    updateAmmoUI();
    feetY = 0; jumpVelocity = 0; isGrounded = true; playerJumping = false;
    camera.position.set(0, EYE_H, 10);

    for (var i = enemies.length - 1; i >= 0; i--) {
      var en = enemies[i];
      scene.remove(en.group);
      for (var j = 0; j < en.parts.length; j++) {
        en.parts[j].mesh.geometry.dispose();
        en.parts[j].mesh.material.dispose();
      }
      if (en.gun) {
        en.gun.geometry.dispose();
        en.gun.material.dispose();
      }
      if (en.charMaterial) en.charMaterial.dispose();
    }
    enemies.length = 0;
    for (var k = 0; k < ENEMY_COUNT; k++) enemies.push(createEnemy());
    remainingEnemies = ENEMY_COUNT;
    updateTargetInfo();

    for (var hpi = 0; hpi < healthPacks.length; hpi++) {
      healthPacks[hpi].active = true;
      healthPacks[hpi].group.visible = true;
    }

    endScreen.classList.add("hidden");
  }

  restartBtn.addEventListener("click", function () {
    ensureAudio();
    resetGame();
    tryLockLandscape();
    if (isTouch) enterGame();
    else canvas.requestPointerLock();
  });

  /* ---------------- 移动端虚拟摇杆 ---------------- */
  var joyZone = document.getElementById("joy-zone");
  var joyBase = document.getElementById("joy-base");
  var joyKnob = document.getElementById("joy-knob");
  var joyInput = { x: 0, y: 0 };
  var joyId = null, JOY_R = 46;

  function joyFromTouch(t) {
    var r = joyBase.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var dx = t.clientX - cx, dy = t.clientY - cy;
    var dist = Math.hypot(dx, dy);
    if (dist > JOY_R) { dx = dx / dist * JOY_R; dy = dy / dist * JOY_R; }
    joyKnob.style.transform = "translate(" + dx + "px," + dy + "px)";
    joyInput.x = dx / JOY_R;
    joyInput.y = dy / JOY_R;
  }
  function joyReset() {
    joyId = null; joyInput.x = 0; joyInput.y = 0;
    joyKnob.style.transform = "translate(0,0)";
  }
  joyZone.addEventListener("touchstart", function (ev) {
    if (joyId !== null) return;
    var t = ev.changedTouches[0];
    joyId = t.identifier;
    joyFromTouch(t);
    ev.preventDefault();
  }, { passive: false });
  joyZone.addEventListener("touchmove", function (ev) {
    for (var i = 0; i < ev.changedTouches.length; i++) {
      var t = ev.changedTouches[i];
      if (t.identifier === joyId) joyFromTouch(t);
    }
    ev.preventDefault();
  }, { passive: false });
  function joyEnd(ev) {
    for (var i = 0; i < ev.changedTouches.length; i++) {
      if (ev.changedTouches[i].identifier === joyId) joyReset();
    }
  }
  joyZone.addEventListener("touchend", joyEnd);
  joyZone.addEventListener("touchcancel", joyEnd);

  /* ---------------- 移动端滑动视角 ---------------- */
  var lookZone = document.getElementById("look-zone");
  var lookId = null, lastLX = 0, lastLY = 0;
  var TOUCH_SENS = 0.0045;
  lookZone.addEventListener("touchstart", function (ev) {
    if (lookId !== null) return;
    var t = ev.changedTouches[0];
    lookId = t.identifier; lastLX = t.clientX; lastLY = t.clientY;
    ev.preventDefault();
  }, { passive: false });
  lookZone.addEventListener("touchmove", function (ev) {
    for (var i = 0; i < ev.changedTouches.length; i++) {
      var t = ev.changedTouches[i];
      if (t.identifier === lookId) {
        var dx = t.clientX - lastLX, dy = t.clientY - lastLY;
        lastLX = t.clientX; lastLY = t.clientY;
        var ts = TOUCH_SENS * Math.max(camera.fov / BASE_FOV, 0.45); // 开镜时同样要降低灵敏度，原因同桌面端鼠标；同样设下限避免转不动
        yaw -= dx * ts;
        pitch -= dy * ts;
        pitch = Math.max(-PITCH_LIM, Math.min(PITCH_LIM, pitch));
      }
    }
    ev.preventDefault();
  }, { passive: false });
  function lookEnd(ev) {
    for (var i = 0; i < ev.changedTouches.length; i++) {
      if (ev.changedTouches[i].identifier === lookId) lookId = null;
    }
  }
  lookZone.addEventListener("touchend", lookEnd);
  lookZone.addEventListener("touchcancel", lookEnd);

  /* ---------------- 移动端开火 / 换弹按钮（支持长按连发；左右各一个开火键，双手都能开火） ---------------- */
  var touchFiring = false;
  var touchFiringRight = false, touchFiringLeft = false;
  function syncTouchFiring() { touchFiring = touchFiringRight || touchFiringLeft; }
  function wireFireButton(btn, setFlag) {
    // 触屏事件的 touchmove/touchend 只会送到 touchstart 发生的那个元素上，不会
    // 跟着手指挪到 look-zone 上——所以按住开火键的同一根手指拖动时视角纹丝不动。
    // 这里直接在开火键自身上也监听拖动，按住开火键时同一手指滑动照样转视角。
    var btnTouchId = null, lastBX = 0, lastBY = 0;
    btn.addEventListener("touchstart", function (ev) {
      ev.preventDefault();
      setFlag(true);
      syncTouchFiring();
      btn.classList.add("firing");
      shoot();
      var t = ev.changedTouches[0];
      btnTouchId = t.identifier; lastBX = t.clientX; lastBY = t.clientY;
    }, { passive: false });
    btn.addEventListener("touchmove", function (ev) {
      for (var i = 0; i < ev.changedTouches.length; i++) {
        var t = ev.changedTouches[i];
        if (t.identifier === btnTouchId) {
          var dx = t.clientX - lastBX, dy = t.clientY - lastBY;
          lastBX = t.clientX; lastBY = t.clientY;
          var ts = TOUCH_SENS * Math.max(camera.fov / BASE_FOV, 0.45);
          yaw -= dx * ts;
          pitch -= dy * ts;
          pitch = Math.max(-PITCH_LIM, Math.min(PITCH_LIM, pitch));
        }
      }
      ev.preventDefault();
    }, { passive: false });
    btn.addEventListener("touchend", function (ev) {
      ev.preventDefault();
      setFlag(false);
      syncTouchFiring();
      btn.classList.remove("firing");
      btnTouchId = null;
    }, { passive: false });
    btn.addEventListener("touchcancel", function () {
      setFlag(false);
      syncTouchFiring();
      btn.classList.remove("firing");
      btnTouchId = null;
    });
  }
  var fireBtn = document.getElementById("fire-btn");
  wireFireButton(fireBtn, function (v) { touchFiringRight = v; });
  var fireBtnLeft = document.getElementById("fire-btn-left");
  wireFireButton(fireBtnLeft, function (v) { touchFiringLeft = v; });

  var reloadBtn = document.getElementById("reload-btn");
  reloadBtn.addEventListener("touchstart", function (ev) { ev.preventDefault(); startReload(); }, { passive: false });

  var viewBtn = document.getElementById("view-btn");
  viewBtn.addEventListener("touchstart", function (ev) { ev.preventDefault(); toggleViewMode(); }, { passive: false });

  var jumpBtn = document.getElementById("jump-btn");
  jumpBtn.addEventListener("touchstart", function (ev) { ev.preventDefault(); tryJump(); }, { passive: false });

  /* ---------------- 倍镜瞄准：桌面端按住鼠标右键，移动端按住镜头按钮 ---------------- */
  var isScoped = false;
  var scopeOverlayEl = document.getElementById("scope-overlay");
  function setScoped(v) {
    if (v === isScoped) return;
    if (v && viewMode !== "fp") return; // 只在第一人称下能开镜，第三人称没有意义
    isScoped = v;
    scopeOverlayEl.classList.toggle("show", isScoped);
    reticle.classList.toggle("hidden-by-scope", isScoped);
    gunView.visible = !isScoped && viewMode === "fp";
    scopeBtn.classList.toggle("scoping", isScoped);
  }
  var scopeBtn = document.getElementById("scope-btn");
  // 移动端做成点一下开镜、再点一下关镜（跟其他触屏按钮的单击操作习惯一致）；
  // 之前是"按住不放"，手指快速点一下的话开镜和关镜几乎同时触发，视觉上像完全没反应
  scopeBtn.addEventListener("touchstart", function (ev) { ev.preventDefault(); setScoped(!isScoped); }, { passive: false });
  canvas.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
  document.addEventListener("mousedown", function (ev) {
    if (ev.button !== 2 || isTouch || document.pointerLockElement !== canvas) return;
    setScoped(true);
  });
  document.addEventListener("mouseup", function (ev) {
    if (ev.button !== 2) return;
    setScoped(false);
  });

  /* ---------------- 移动反馈：视角起伏 + FOV（无左右摇摆，避免眩晕） ---------------- */
  var BASE_FOV = 75, RUN_FOV = 78, SCOPE_FOV = 22;
  var BOB_FREQ = 7.5, BOB_AMP = 0.035, FOOTSTEP_INTERVAL = 0.36;

  /* ---------------- 跳跃（脚部高度用绝对世界坐标跟踪，能跳到掩体顶部再落地站住） ---------------- */
  var GRAVITY = -20, JUMP_SPEED = 6.6;
  var feetY = 0, jumpVelocity = 0, isGrounded = true;
  var landDip = 0; // 落地那一下给镜头一点短促下沉再回弹，比单纯的抛物线更有"踩到地面"的实感
  function tryJump() {
    if (!gameActive || !isGrounded) return;
    isGrounded = false;
    jumpVelocity = JUMP_SPEED;
    playerJumping = true;
  }
  var bobTime = 0, footstepTimer = 0;

  function updateMovement(dt) {
    if (!gameActive) return;
    camera.rotation.set(pitch, yaw, 0, "YXZ");

    var fwd = 0, right = 0;
    if (isTouch) {
      fwd = -joyInput.y; right = joyInput.x;
    } else {
      if (keys.KeyW || keys.ArrowUp) fwd += 1;
      if (keys.KeyS || keys.ArrowDown) fwd -= 1;
      if (keys.KeyD || keys.ArrowRight) right += 1;
      if (keys.KeyA || keys.ArrowLeft) right -= 1;
    }
    var len = Math.hypot(fwd, right);
    if (len > 1) { fwd /= len; right /= len; }
    if (len > 0.001) {
      var fx = -Math.sin(yaw), fz = -Math.cos(yaw);
      var rx = Math.cos(yaw), rz = -Math.sin(yaw);
      var moveDirX = fx * fwd + rx * right, moveDirZ = fz * fwd + rz * right;
      attemptMove(moveDirX * MOVE_SPEED * dt, moveDirZ * MOVE_SPEED * dt);
      // 身体转向实际移动方向（不是镜头方向）：后退/平移时人物会自然转身、正面朝着前进方向，
      // 跑步动画才不会跟位移对不上看起来像滑步
      var targetBodyYaw = Math.atan2(-moveDirX, -moveDirZ);
      if (!bodyYawInited) { bodyYaw = targetBodyYaw; bodyYawInited = true; }
      var bodyYawDiff = targetBodyYaw - bodyYaw;
      bodyYawDiff = ((bodyYawDiff % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
      bodyYaw += bodyYawDiff * Math.min(dt * 12, 1);
    } else if (!bodyYawInited) {
      bodyYaw = yaw;
      bodyYawInited = true;
    } else {
      // 站定不动时身体慢慢转回跟镜头一致的朝向（贴近"站桩瞄准"的直觉）
      var idleYawDiff = yaw - bodyYaw;
      idleYawDiff = ((idleYawDiff % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
      bodyYaw += idleYawDiff * Math.min(dt * 5, 1);
    }

    var isMoving = len > 0.05;
    playerMoving = isMoving;
    // 走/跑切换的阈值带一点滞回（上切 0.6 / 下切 0.4）：触屏摇杆推到临界值附近会有细微抖动，
    // 用同一个阈值上下切的话动作会跟着来回切换、交叉淡入淡出反复打断，看起来就是"卡帧"
    playerSpeedTier = len > 0.6 ? "run" : (len < 0.4 ? "walk" : playerSpeedTier);
    if (isMoving) {
      bobTime += dt * BOB_FREQ * Math.max(len, 0.4);
      if (isGrounded) {
        footstepTimer += dt;
        if (footstepTimer >= FOOTSTEP_INTERVAL) { footstepTimer = 0; playFootstep(); }
      }
    } else {
      footstepTimer = 0;
    }

    // 跳跃/重力：每帧都用重力算一次下一步的脚部高度，跟当前位置正下方的地形/掩体顶面比较——
    // 高于地形就是还在空中，落到地形上（或以下）就贴住地形高度、判定为落地。这样跳跃不但能起跳，
    // 落地点如果是掩体顶部也会稳稳站上去，而不是固定摔回地面高度 0
    jumpVelocity += GRAVITY * dt;
    var nextFeetY = feetY + jumpVelocity * dt;
    var groundY = groundHeightAt(camera.position.x, camera.position.z, feetY);
    if (nextFeetY <= groundY) {
      if (!isGrounded && jumpVelocity < -3) {
        // 摔落速度越快，落地那一下沉得越明显，配合落地音效才有"踩实了"的感觉
        landDip = Math.min(0.16, -jumpVelocity * 0.012);
        playLand();
      }
      nextFeetY = groundY;
      jumpVelocity = 0;
      isGrounded = true;
      playerJumping = false;
    } else {
      isGrounded = false;
    }
    feetY = nextFeetY;
    landDip *= Math.exp(-dt * 14);
    // 仅上下起伏，不做左右滚转，避免整屏晃动导致眩晕
    camera.position.y = feetY + EYE_H - landDip + (isMoving && isGrounded ? Math.abs(Math.sin(bobTime)) * BOB_AMP : 0);

    // 枪械视图模型：随移动轻微摆动 + 开火后坐力回弹 + 换弹时的下压/回摆动作
    gunRecoil *= Math.exp(-dt * 12);
    // 换弹动作之前只在第三人称骨骼模型上播（triggerReloadAnim），第一人称枪械视图完全没有动作、
    // 弹药却凭空变满，看起来很奇怪——这里用一个 0→1→0 的抛物线状进度（sin 曲线）驱动枪身下压+侧倾+回正，
    // 时长跟 RELOAD_MS 对齐，不需要额外的动画系统
    var reloadT = isReloading ? Math.min(1, (performance.now() - reloadStartTime) / RELOAD_MS) : 0;
    var reloadArc = Math.sin(reloadT * Math.PI);
    // 枪的摆动要跟镜头/脚步用同一个 bobTime 相位，之前 y 轴用了 2 倍频率，跟跑步节奏对不上
    gunView.position.x = GUN_REST.x + (isMoving ? Math.cos(bobTime) * 0.01 : 0) - reloadArc * 0.05;
    gunView.position.y = GUN_REST.y + (isMoving ? Math.abs(Math.sin(bobTime)) * 0.014 : 0) + gunRecoil * 0.01 - reloadArc * 0.17;
    gunView.position.z = GUN_REST.z + gunRecoil * 0.12;
    gunView.rotation.x = gunRecoil * 0.22 + reloadArc * 0.5;
    gunView.rotation.z = reloadArc * 0.35;

    var targetFov = isScoped ? SCOPE_FOV : (isMoving ? RUN_FOV : BASE_FOV);
    var nextFov = camera.fov + (targetFov - camera.fov) * Math.min(dt * (isScoped ? 10 : 6), 1);
    if (Math.abs(nextFov - camera.fov) > 0.01) {
      camera.fov = nextFov;
      camera.updateProjectionMatrix();
    }

    if ((isTouch && touchFiring) || (!isTouch && mouseFiring)) shoot();
  }

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    tpCamera.aspect = camera.aspect;
    tpCamera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });

  var last = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    var now = performance.now();
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    updateMovement(dt);
    // 敌人的朝向/移动要先算完，AI 判断视野盲区和读取枪口位置时用的才是这一帧最新的朝向和骨骼姿态，
    // 不然读到的是上一帧的旧数据——玩家会看到"明明没转过来的敌人却精准命中"、"子弹不是从枪口飞出"
    updateEnemyMovement(dt);
    updateEnemyAI();
    updateCharacterAnimations(dt);
    updateEffects();
    updateDust(dt);
    updateSky(dt);
    updateBeacons(now);
    updateHealthPacks(now);
    updateThirdPerson(dt);
    renderPass.camera = viewMode === "tp" ? tpCamera : camera;
    composer.render();
  }
  animate();
  } // end startGame

  loadCharacterThenStart();
})();
</script>
