<title>刺激战争</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/SMAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/SMAAPass.js"></script>

<style>
  :root {
    --bg: #08061a;
    --panel: #130f2a;
    --panel-2: #1b1440;
    --ink: #dff6ff;
    --ink-dim: #7f8cc4;
    --accent: #00e5ff;
    --accent-dim: #0a7a94;
    --olive: #c026ff;
    --danger: #ff2f6d;
    --rule: #2e2358;
    font-variant-numeric: tabular-nums;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    touch-action: none;
    overscroll-behavior: none;
  }

  body {
    font-family: "Noto Sans SC", "Rajdhani", -apple-system, sans-serif;
    color: var(--ink);
  }

  #stage {
    position: absolute;
    inset: 0;
    background: var(--bg);
  }

  #stage canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------------- 准星：简洁十字，中心留空，不做成瞄准镜边框样式 ---------------- */
  #reticle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 26px;
    height: 26px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 20;
    display: none;
    transition: transform 0.08s ease;
  }
  #reticle.visible { display: block; }
  #reticle.firing { transform: translate(-50%, -50%) scale(0.86); }
  .reticle-dash {
    position: absolute;
    background: rgba(240, 233, 216, 0.9);
    box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
    border-radius: 1px;
  }
  #reticle.firing .reticle-dash { background: var(--accent); }
  .rd-top { top: 0; left: 50%; width: 2px; height: 7px; transform: translateX(-50%); }
  .rd-bottom { bottom: 0; left: 50%; width: 2px; height: 7px; transform: translateX(-50%); }
  .rd-left { left: 0; top: 50%; width: 7px; height: 2px; transform: translateY(-50%); }
  .rd-right { right: 0; top: 50%; width: 7px; height: 2px; transform: translateY(-50%); }
  .rd-dot {
    top: 50%; left: 50%; width: 2px; height: 2px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    opacity: 0.7;
  }

  /* 爆头提示 */
  #headshot-popup {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    z-index: 21;
    font-family: "Rajdhani", sans-serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--danger);
    text-shadow: 0 0 12px rgba(255, 47, 109, 0.75);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #headshot-popup.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* 受击屏幕反馈 */
  #hit-flash {
    position: absolute;
    inset: 0;
    z-index: 22;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 20, 90, 0.55) 100%);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  #hit-flash.show { opacity: 1; transition: opacity 0.03s ease; }

  /* 倍镜：经典的"圆形窥孔"做法——用一圈巨大的 box-shadow 把圆孔以外的地方全部涂黑 */
  #scope-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(60vh, 60vw);
    height: min(60vh, 60vw);
    margin-left: calc(min(60vh, 60vw) / -2);
    margin-top: calc(min(60vh, 60vw) / -2);
    border-radius: 50%;
    box-shadow: 0 0 0 9999px #08061a;
    border: 2px solid rgba(10, 10, 10, 0.7);
    z-index: 24;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
  }
  #scope-overlay.show { opacity: 1; }
  .scope-line {
    position: absolute;
    background: rgba(15, 14, 10, 0.8);
  }
  .scope-h { top: 50%; left: 8%; right: 8%; height: 1.5px; transform: translateY(-50%); }
  .scope-v { left: 50%; top: 8%; bottom: 8%; width: 1.5px; transform: translateX(-50%); }
  .scope-dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 5px; height: 5px;
    margin: -2.5px 0 0 -2.5px;
    border-radius: 50%;
    background: rgba(15, 14, 10, 0.85);
  }
  #reticle.hidden-by-scope { display: none; }

  /* 受击方向提示：一个指向伤害来源方位的箭头，围绕屏幕中心旋转定位 */
  #dmg-indicators {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    z-index: 23;
    pointer-events: none;
  }
  /* 圆润的柔光团代替原来的硬边三角箭头，朝伤害来源方向淡入淡出，观感更自然。
     外层 .dmg-arrow 只负责定位（旋转到方位角 + 推到屏幕边缘，内联 style 设置），
     缩放/淡出动画放在内层 .dmg-arrow-glow 自己的 transform 上，两者互不冲突 */
  .dmg-arrow { position: absolute; top: 0; left: 0; width: 0; height: 0; }
  .dmg-arrow-glow {
    position: absolute;
    top: 0; left: 0;
    width: 64px;
    height: 64px;
    margin: -32px 0 0 -32px;
    opacity: 0;
    border-radius: 50%;
    background: radial-gradient(ellipse 60% 100% at 50% 30%, rgba(255, 90, 160, 0.9) 0%, rgba(255, 30, 110, 0.45) 45%, rgba(255, 30, 110, 0) 75%);
    animation: dmg-arrow-fade 1s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
  }
  @keyframes dmg-arrow-fade {
    0% { opacity: 0; transform: scale(0.7) translateY(0); }
    18% { opacity: 1; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(1.1) translateY(6px); }
  }

  /* ---------------- HUD 状态条 ---------------- */
  #hud {
    position: absolute;
    top: 18px;
    left: 18px;
    z-index: 20;
    display: none;
    font-family: "Rajdhani", "Noto Sans SC", sans-serif;
  }
  #hud.visible { display: flex; gap: 2px; flex-wrap: wrap; max-width: 92vw; }

  /* 局内右上角商店按钮 + 面板：切武器/换皮肤，随时可开，打开时自动暂停 */
  #shop-btn {
    position: absolute;
    top: 18px;
    right: 18px;
    /* 移动端右侧大半屏是视角滑动区（#touch-layer 里的 #look-zone，z-index:30），
       这里如果 z-index 比它低，按钮会被盖在下面摸不到——必须更高 */
    z-index: 32;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 50%;
    background: rgba(19, 15, 42, 0.82);
    border: 1px solid var(--rule);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #shop-btn svg { width: 62%; height: 62%; }
  #shop-btn.visible { display: flex; }
  #shop-btn:active { background: rgba(0, 229, 255, 0.2); }

  #shop-panel {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(3, 2, 12, 0.72);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #shop-panel.show { display: flex; }
  #shop-card {
    width: min(560px, 100%);
    max-height: 84vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--rule);
    box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
    padding: 20px;
  }
  #shop-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 12px;
    margin-bottom: 14px;
  }
  #shop-title {
    font-family: "Rajdhani", sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  #shop-close-btn {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink);
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 15px;
  }
  #shop-close-btn:active { background: rgba(255, 47, 109, 0.2); }
  .shop-section-label {
    font-family: "Rajdhani", sans-serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin: 14px 0 8px;
  }
  .shop-weapon-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #skin-swatches {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .skin-swatch {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(19, 15, 42, 0.7);
    border: 1px solid var(--rule);
    padding: 8px 10px;
    cursor: pointer;
    color: var(--ink);
    font-family: "Rajdhani", sans-serif;
    font-size: 12px;
  }
  .skin-swatch::before {
    content: "";
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--swatch-color);
    border: 1px solid rgba(255, 255, 255, 0.3);
    flex: none;
  }
  .skin-swatch.selected {
    border-color: var(--accent);
    background: rgba(0, 229, 255, 0.12);
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
  }
  @media (max-width: 480px) {
    .shop-weapon-cards, #skin-swatches { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  .hud-chip {
    background: rgba(33, 31, 24, 0.82);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    padding: 8px 18px 8px 14px;
    min-width: 100px;
  }
  .hud-chip + .hud-chip { border-left-color: var(--olive); }
  .hud-chip.hp-chip { border-left-color: var(--danger); }
  .hud-chip.ammo-chip { border-left-color: #d8c37a; }
  .hud-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .hud-value {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.15;
    color: var(--ink);
  }
  .hud-value .accent { color: var(--accent); }
  .hud-value.reloading { color: var(--accent); font-size: 15px; }
  .hud-value.low { color: var(--danger); }

  /* ---------------- 生命值条（左下角） ---------------- */
  #hp-bar-wrap {
    position: absolute;
    left: 18px;
    bottom: 190px;
    z-index: 20;
    display: none;
    align-items: center;
    gap: 10px;
    font-family: "Rajdhani", "Noto Sans SC", sans-serif;
    pointer-events: none;
  }
  #hp-bar-wrap.visible { display: flex; }
  #hp-bar-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    text-transform: uppercase;
    writing-mode: vertical-rl;
  }
  #hp-bar-track {
    width: 168px;
    height: 20px;
    background: rgba(33, 31, 24, 0.82);
    border: 1px solid var(--rule);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    overflow: hidden;
  }
  #hp-bar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #7a9c3f, #a8c24a);
    transition: width 0.25s ease, background 0.25s ease;
  }
  #hp-bar-fill.low { background: linear-gradient(90deg, #8a2418, var(--danger)); }
  #hp-bar-val {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    min-width: 2.4em;
  }
  #hp-bar-val.low { color: var(--danger); }

  /* ---------------- 开始 / 暂停 遮罩 ---------------- */
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: safe center;
    overflow-y: auto;
    padding: 3vh 5vw;
    background:
      radial-gradient(ellipse 80% 60% at 30% 45%, rgba(0, 229, 255, 0.10), transparent 60%),
      linear-gradient(160deg, #0a0718 0%, #150f2c 55%, #1c1440 100%);
    cursor: pointer;
  }
  #overlay.hidden { display: none; }

  #brief {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6vw;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    cursor: default;
  }

  #brief-main { flex: 1 1 auto; min-width: 0; }
  #brief-cta {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .cta-hint {
    font-family: "Rajdhani", sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .brief-eyebrow {
    font-family: "Rajdhani", sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  #brief h1 {
    font-family: "Orbitron", "Rajdhani", sans-serif;
    font-size: clamp(28px, 6vw, 64px);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: 0.06em;
    text-wrap: balance;
    color: var(--ink);
    text-shadow: 0 0 6px rgba(0, 229, 255, 0.55), 0 0 26px rgba(0, 229, 255, 0.35), 0 2px 24px rgba(0, 0, 0, 0.6);
  }

  .brief-rule {
    width: 72px;
    height: 3px;
    background: var(--accent);
    margin: 14px 0;
  }

  .brief-desc {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-dim);
    max-width: 46ch;
    margin-bottom: 16px;
  }

  .loadout {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-top: 1px solid var(--rule);
    padding-top: 12px;
  }
  .loadout-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    font-size: 13px;
  }
  .loadout-key {
    font-family: "Rajdhani", sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--bg);
    background: var(--ink-dim);
    padding: 2px 8px;
    min-width: 60px;
    text-align: center;
  }
  .loadout-desc { color: var(--ink-dim); }
  .loadout.mobile-only { display: none; }

  #weapon-select {
    border-top: 1px solid var(--rule);
    padding-top: 12px;
    margin-top: 4px;
  }
  .weapon-select-label {
    font-family: "Rajdhani", sans-serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .weapon-cards {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }
  .weapon-card {
    text-align: left;
    background: rgba(19, 15, 42, 0.7);
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 8px 10px;
    cursor: pointer;
    font-family: inherit;
  }
  .weapon-card.selected {
    border-color: var(--accent);
    background: rgba(0, 229, 255, 0.12);
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
  }
  .wc-icon {
    width: 100%;
    height: 40px;
    margin-bottom: 6px;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    filter: drop-shadow(0 0 4px rgba(0, 229, 255, 0.25));

  .wc-name {
    font-family: "Rajdhani", sans-serif;
    font-weight: 700;
    font-size: 13px;
  }
  .wc-desc {
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 3px;
    line-height: 1.3;
  }
  @media (max-width: 640px) {
    .weapon-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  #start-btn {
    font-family: "Rajdhani", sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    border: none;
    padding: 15px 40px;
    white-space: nowrap;
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    cursor: pointer;
  }
  #start-btn:active { background: #00a8c2; }

  body.is-touch .desktop-only { display: none; }
  body.is-touch .mobile-only { display: flex; }

  @media (max-width: 640px) {
    #brief { flex-direction: column; align-items: flex-start; gap: 20px; }
    #brief-cta { align-items: flex-start; width: 100%; }
    #start-btn { width: 100%; text-align: center; }
  }
  @media (max-height: 480px) {
    .brief-desc { display: none; }
    .brief-eyebrow { margin-bottom: 6px; }
    .brief-rule { margin: 8px 0; }
    .loadout { gap: 4px; padding-top: 8px; }
  }
  @media (max-height: 360px) {
    .loadout-row:nth-child(n+3) { display: none; }
  }

  /* ---------------- 结算页 ---------------- */
  #end-screen {
    position: absolute;
    inset: 0;
    z-index: 51;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(0, 229, 255, 0.10), transparent 60%),
      linear-gradient(160deg, #0a0718 0%, #150f2c 55%, #1c1440 100%);
  }
  #end-screen.hidden { display: none; }
  #end-screen.lose {
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(255, 47, 109, 0.16), transparent 60%),
      linear-gradient(160deg, #0f0616 0%, #1a0e2a 55%, #221238 100%);
  }
  .end-eyebrow {
    font-family: "Rajdhani", sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  #end-screen.lose .end-eyebrow { color: var(--danger); }
  #end-screen h1 {
    font-size: clamp(34px, 6vw, 52px);
    font-weight: 900;
    color: var(--ink);
    margin-bottom: 6px;
  }
  #final-score {
    font-family: "Rajdhani", sans-serif;
    font-size: 84px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin: 10px 0 6px;
  }
  #end-screen.lose #final-score { color: var(--danger); }
  #final-score-sub {
    font-size: 13px;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
    margin-bottom: 28px;
  }
  #restart-btn {
    font-family: "Rajdhani", sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    border: none;
    padding: 15px 46px;

<script>
(function () {
  "use strict";
  function loadCharacterThenStart() {
    var loader = new THREE.GLTFLoader();
    loader.load("character.glb", function (gltf) {
      fetch("motion-clips.json")
        .then(function (res) { return res.ok ? res.json() : {}; })
        .catch(function () { return {}; })
        .then(function (clipsJson) {
          gltf.extraClips = parseExtraClips(clipsJson);
          startGame(gltf);
        });
    }, undefined, function (err) {
      console.warn("人物模型加载失败，使用程序化建模作为后备", err);
      startGame(null);
    });
  }

  function parseExtraClips(clipsJson) {
    var clips = {};
    if (!clipsJson) return clips;
    for (var key in clipsJson) {
      try {
        clips[key] = THREE.AnimationClip.parse(clipsJson[key]);
      } catch (e) {
        console.warn("动作片段解析失败：" + key, e);
      }
    }
    return clips;
  }

  function startGame(charGltf) {
  var CHAR = charGltf; // { scene, animations, extraClips } 或 null（后备程序化建模）
  // Mixamo 导出时没勾"In Place"，跑步动作的 Hips 骨骼自己就带了一段水平位移（一个循环里向前挪 2 米多），
  // 而角色的实际移动是由游戏代码按输入/速度另外算的——两者叠加，动画每循环一次（0.75s）就会把身体
  // "吸"回起始位置，看起来像闪现/瞬移。这里把该动作的 Hips 水平分量（X/Z）钉死在第一帧的值上，
  // 只保留竖直方向的自然起伏，让动作纯粹变成"原地摆腿"，水平移动完全交给游戏代码控制
  function stripHorizontalRootMotion(clip) {
    if (!clip) return clip;
    for (var i = 0; i < clip.tracks.length; i++) {
      var track = clip.tracks[i];
      if (track.name === "mixamorigHips.position" && track.values && track.values.length >= 3) {
        var baseX = track.values[0], baseZ = track.values[2];
        for (var k = 0; k < track.values.length; k += 3) {
          track.values[k] = baseX;
          track.values[k + 2] = baseZ;
        }
      }
    }
    return clip;
  }
  // 待机 / 走路 / 跑步 / 射击 / 装弹 / 俯卧转身 / 跳跃 / 死亡，全部共用同一套骨骼命名，
  // 可以被所有角色实例（敌人 + 玩家）的 AnimationMixer 共同引用，不需要每个实例各自复制一份关键帧数据；
  // crouchRun 是最早接入的蹲姿跑动作，现在保留着备用，主状态机改用更通用的 idle/walk/run 一套
  var CLIPS = null;
  if (CHAR) {
    var extra = CHAR.extraClips || {};
    CLIPS = {
      crouchRun: CHAR.animations && CHAR.animations[0] ? stripHorizontalRootMotion(CHAR.animations[0]) : null,
      idle: extra.idle || null,
      walk: stripHorizontalRootMotion(extra.walk || null),
      run: stripHorizontalRootMotion(extra.run || null),
      fire: extra.fire || null,
      reload: extra.reload || null,
      prone_turn: extra.prone_turn || null,
      jump: extra.jump || null,
      dying: extra.dying || null,
    };
  }
  function findBoneExact(root, name) {
    var found = null;
    root.traverse(function (o) { if (!found && o.isBone && o.name === name) found = o; });
    return found;
  }
  // 手骨骼绑定姿势本身朝向是任意的（取决于骨架），直接把枪挂上去、不修正旋转的话枪口指向完全无法预期，
  // 看起来就像贴脸上一个来路不明的方块。这里在挂载的那一刻（角色还没开始播动作、姿势就是骨架的绑定姿势）
  // 量出手骨骼当时的世界朝向，反推出一个局部旋转，让枪的长边（局部 +Z）之后始终对齐角色的正前方、
  // 保持水平——因为是挂在骨骼下面的局部变换，动作播放时手怎么摆，枪就跟着自然摆，不会跳来跳去
  var __gunForwardQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI, 0));
  var __handWorldQuat = new THREE.Quaternion();
  function orientGunToHand(handBone, gun) {
    handBone.updateMatrixWorld(true);
    handBone.getWorldQuaternion(__handWorldQuat);
    gun.quaternion.copy(__handWorldQuat).invert().multiply(__gunForwardQuat);
  }
  // 给一个骨骼动画角色实例创建可切换的动作状态机（run / prone_turn / jump / dying）
  function buildActionState(mixer) {
    var actions = {};
    for (var k in CLIPS) {
      if (CLIPS[k]) actions[k] = mixer.clipAction(CLIPS[k]);
    }
    return { actions: actions, current: null };
  }
  // 带交叉淡入淡出地切换到某个动作；opts.once 播一次并定格在最后一帧，否则循环播放
  function playAction(state, name, opts) {
    opts = opts || {};
    var next = state.actions[name];
    if (!next) return;
    if (state.current === name && !opts.restart) return;
    var prevName = state.current;

    tpCamera.position.copy(tpSidePivot).addScaledVector(tpBackDir, tpCurrentDistance);
    tpCamera.rotation.set(pitch, yaw, 0, "YXZ");
  }

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 软阴影，边缘不再是硬邦邦的锯齿块
  // sRGB 输出 + 色调映射，画面对比度和色彩会明显丰富一些
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.45; // 夜战场景整体调暗了，曝光补一点，保证还能看清敌人
  stage.appendChild(renderer.domElement);

  // 后处理：Bloom 辉光，霓虹灯光/枪口火光/警示灯这些高亮元素会自然"溢出"发光，赛博朋克夜景的质感主要靠它撑起来；
  // threshold 调得比较高，只有真正很亮的东西（灯光、发光贴花）才会起辉光，不会让整个场景糊成一片
  var composer = new THREE.EffectComposer(renderer);
  var renderPass = new THREE.RenderPass(scene, camera);
  composer.addPass(renderPass);
  var bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.85, 0.55, 0.82);
  composer.addPass(bloomPass);
  // 后处理链路会绕开 WebGLRenderer 自带的 antialias（离屏渲染目标默认没有多重采样），
  // 边缘容易出现锯齿；加一道 SMAA 在最后把边缘抗锯齿补回来，比开多重采样渲染目标更省性能
  var smaaPass = new THREE.SMAAPass(window.innerWidth * renderer.getPixelRatio(), window.innerHeight * renderer.getPixelRatio());
  composer.addPass(smaaPass);

  var hemiLight = new THREE.HemisphereLight(weather.hemiSky, weather.hemiGround, weather.hemiIntensity);
  scene.add(hemiLight);
  var sun = new THREE.DirectionalLight(weather.sunColor, weather.sunIntensity);
  sun.position.set(60, 90, 40);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -80;
  sun.shadow.camera.right = 80;
  sun.shadow.camera.top = 80;
  sun.shadow.camera.bottom = -80;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 220;
  scene.add(sun);

  /* ---------------- 天空穹顶（渐变）+ 云层 + 下雨粒子 ---------------- */
  var clouds = [];
  var rainPoints = null;
  (function buildSky() {
    var skyGeo = new THREE.SphereGeometry(420, 20, 14);
    var skyMat = new THREE.ShaderMaterial({
      uniforms: {
        topColor: { value: new THREE.Color(weather.skyTop) },
        bottomColor: { value: new THREE.Color(weather.skyBottom) },
      },
      vertexShader: "varying vec3 vWorldPos; void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vWorldPos = wp.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
      fragmentShader: "uniform vec3 topColor; uniform vec3 bottomColor; varying vec3 vWorldPos; void main() { float h = clamp(normalize(vWorldPos).y * 1.6 + 0.15, 0.0, 1.0); gl_FragColor = vec4(mix(bottomColor, topColor, pow(h, 0.55)), 1.0); }",
      side: THREE.BackSide,
      fog: false,
      depthWrite: false,
    });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // 云：柔化圆斑贴图的一批扁平广告牌，飘在天上，会缓慢横向漂移
    var cloudCanvas = document.createElement("canvas");
    cloudCanvas.width = cloudCanvas.height = 128;
    var cctx = cloudCanvas.getContext("2d");
    var cg = cctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    cg.addColorStop(0, "rgba(255,255,255,0.95)");
    cg.addColorStop(0.5, "rgba(255,255,255,0.55)");
    cg.addColorStop(1, "rgba(255,255,255,0)");
    cctx.fillStyle = cg;
    cctx.fillRect(0, 0, 128, 128);
    var cloudTex = new THREE.CanvasTexture(cloudCanvas);
    var cloudMat = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: weather.cloudOpacity, depthWrite: false, fog: true });
    clouds = [];
    for (var c = 0; c < weather.cloudCount; c++) {
      var mat = cloudMat.clone();
      mat.opacity = weather.cloudOpacity * rr(0.6, 1);
      var sprite = new THREE.Sprite(mat);
      var cAng = rr(0, Math.PI * 2), cR = rr(30, HALF + 120);
      sprite.position.set(Math.sin(cAng) * cR, rr(55, 95), Math.cos(cAng) * cR);
      var s = rr(40, 90);
      sprite.scale.set(s, s * rr(0.45, 0.65), 1);
      scene.add(sprite);
      clouds.push({ sprite: sprite, speed: rr(0.4, 1.1) });
    }

    if (weather.rain) {
      var RAIN_COUNT = 900;
      var rainGeo = new THREE.BufferGeometry();
      var rainPos = new Float32Array(RAIN_COUNT * 3);
      for (var r2 = 0; r2 < RAIN_COUNT; r2++) {
        rainPos[r2 * 3] = rr(-HALF, HALF);
        rainPos[r2 * 3 + 1] = rr(0, 45);
        rainPos[r2 * 3 + 2] = rr(-HALF, HALF);
      }
      rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPos, 3));
      var rainMat = new THREE.PointsMaterial({ color: 0xaebfc9, size: 0.14, transparent: true, opacity: 0.5, depthWrite: false });
      rainPoints = new THREE.Points(rainGeo, rainMat);
      scene.add(rainPoints);
    }
  })();
  function updateSky(dt) {
    for (var i = 0; i < clouds.length; i++) {
      clouds[i].sprite.position.x += dt * clouds[i].speed;
      if (clouds[i].sprite.position.x > HALF + 160) clouds[i].sprite.position.x = -HALF - 160;
    }
    if (rainPoints) {
      var pos = rainPoints.geometry.attributes.position.array;
      for (var j = 1; j < pos.length; j += 3) {
        pos[j] -= dt * 34;
        if (pos[j] < 0) pos[j] = 45;
      }
      rainPoints.geometry.attributes.position.needsUpdate = true;
    }
  }

  /* ---------------- 程序化贴图（无需外部图片资源） ---------------- */
  function makeNoiseTexture(base, size, c1, c2, count) {
    var canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, size, size);
    for (var i = 0; i < count; i++) {
      var x = Math.random() * size, y = Math.random() * size;
      var r = Math.random() * 2.2 + 0.4;
      ctx.fillStyle = Math.random() > 0.5 ? c1 : c2;
      ctx.globalAlpha = 0.12 + Math.random() * 0.32;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    var tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  function makeStripeTexture(base, stripe, size) {
    var canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, size, size);
    var stripeH = size / 14;
    for (var y = 0; y < size; y += stripeH) {
      ctx.fillStyle = stripe;
      ctx.globalAlpha = 0.22;
      ctx.fillRect(0, y, size, stripeH * 0.35);
    }
    ctx.globalAlpha = 1;
    for (var i = 0; i < 500; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? "#000000" : "#ffffff";
      ctx.globalAlpha = Math.random() * 0.08;
      ctx.fillRect(Math.random() * size, Math.random() * size, 2, 2);
    }
    ctx.globalAlpha = 1;
    var tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  // 草地地面：大块深浅色斑模拟草地疏密/踩踏痕迹，再叠一层细碎短线当草叶纹理；
  // 配色压暗一点、偏冷调，跟整体赛博夜色氛围衔接，不是大白天那种饱和亮绿
  function makeGrassTexture(size) {
    var canvas = document.createElement("canvas");
    canvas.width = canvas.height = size;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#2c3d1e";
    ctx.fillRect(0, 0, size, size);
    for (var p = 0; p < 46; p++) {
      var px = Math.random() * size, py = Math.random() * size, pr = 18 + Math.random() * 55;
      ctx.fillStyle = Math.random() < 0.5 ? "rgba(18,26,12,0.35)" : "rgba(64,82,36,0.3)";
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fill();
    }
    for (var i = 0; i < size * size * 0.04; i++) {
      var x = Math.random() * size, y = Math.random() * size;
      var g = 45 + Math.random() * 75;
      ctx.strokeStyle = "rgba(" + ((g * 0.55) | 0) + "," + (g | 0) + "," + ((g * 0.32) | 0) + "," + (0.22 + Math.random() * 0.3) + ")";
      ctx.lineWidth = 1;
      var ang = -Math.PI / 2 + rr(-0.4, 0.4);
      var len = 2.5 + Math.random() * 3.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      ctx.stroke();
    }
    var tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  var groundTex = makeGrassTexture(512);
  groundTex.repeat.set(60, 60);
  var metalTex = makeNoiseTexture("#363b47", 256, "#262a34", "#5a6478", 1800);
  metalTex.repeat.set(2, 2);
  var concreteTex = makeNoiseTexture("#48465a", 256, "#38364a", "#5e5c74", 1600);
  concreteTex.repeat.set(3, 2);
  var rustTex = makeNoiseTexture("#6b4530", 256, "#4a2f1e", "#9c6a3a", 2000);
  rustTex.repeat.set(2, 2);
  var containerTexA = makeStripeTexture("#8a4325", "#c96a3a", 256);
  var containerTexB = makeStripeTexture("#3a5a63", "#5f8a94", 256);

  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(ARENA, ARENA),
    new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95, metalness: 0 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  /* ---------------- 掩体 / 建筑（含碰撞盒） ---------------- */
  var obstacles = [];
  // 屋顶一类"可以站上去但不该挡子弹/挡视线"的悬空平面单独放这里：
  // isClear / groundHeightAt 两个走路用的判定会把它们也算进去，但子弹弹道判定和敌人视线判定
  // （两者都只读 obstacles）不会受影响，不然屋顶一旦能挡墙就会连带挡住隔墙打过去的子弹/AI 视线
  var walkableTops = [];
  var beacons = [];
  function addObstacle(w, h, d, x, z, material, rotY) {
    var mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
    mesh.position.set(x, h / 2, z);
    if (rotY) mesh.rotation.y = rotY;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    obstacles.push({ mesh: mesh, box: new THREE.Box3().setFromObject(mesh) });
    return mesh;
  }
  function addDecor(mesh) {
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    return mesh;
  }

  function rr(min, max) { return min + Math.random() * (max - min); }

  // 地图边界用看不见的空气墙：只挡人挡子弹，不在视觉上把整张地图箱死，
  // 这样远处的山才能被看到，地图观感上是开阔地形而不是一个封闭箱子
  var WALL_T = 2, WALL_H = 7;
  var airWallMat = new THREE.MeshBasicMaterial({ visible: false });
  addObstacle(ARENA + WALL_T * 2, WALL_H, WALL_T, 0, -HALF, airWallMat);
  addObstacle(ARENA + WALL_T * 2, WALL_H, WALL_T, 0, HALF, airWallMat);
  addObstacle(WALL_T, WALL_H, ARENA, -HALF, 0, airWallMat);
  addObstacle(WALL_T, WALL_H, ARENA, HALF, 0, airWallMat);

  /* ---------------- 废弃工厂 ---------------- */
  function buildFactory(cx, cz, rotY, w, d) {
    var group = new THREE.Group();
    group.position.set(cx, 0, cz);
    group.rotation.y = rotY;
    scene.add(group);

    var wallH = 7.5, wallT = 0.6;
    var mat = new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.92 });
    var doorGap = 5.2;

    function localWall(lw, lh, ld, lx, lz) {
      var mesh = new THREE.Mesh(new THREE.BoxGeometry(lw, lh, ld), mat);
      mesh.position.set(lx, lh / 2, lz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      // 注意：必须更新 group（父级）的世界矩阵，而不是 mesh 自己的——
      // 否则父级的 position/rotation 还没生效，算出来的世界坐标会退化成局部坐标，
      // 所有子物体等于全部叠在地图原点附近，摸起来就是"空气墙"
      group.updateMatrixWorld(true);
      var box = new THREE.Box3().setFromObject(mesh);
      obstacles.push({ mesh: mesh, box: box });
    }

    // 前墙留出大门缺口
    var frontSeg = (w - doorGap) / 2;
    localWall(frontSeg, wallH, wallT, -(doorGap / 2 + frontSeg / 2), d / 2);
    localWall(frontSeg, wallH, wallT, (doorGap / 2 + frontSeg / 2), d / 2);
    // 后墙 + 两侧墙
    localWall(w, wallH, wallT, 0, -d / 2);
    localWall(wallT, wallH, d, -w / 2, 0);
    localWall(wallT, wallH, d, w / 2, 0);

    // 屋顶：不挡子弹/不挡视线（不进 obstacles，射线/AI 相关判定不会碰到它），
    // 但登记进 walkableTops 让人可以跳上去站住，而不是像之前那样一跳上去就直接摔穿掉进室内地面高度
    var roof = new THREE.Mesh(
      new THREE.BoxGeometry(w + 1, 0.4, d + 1),
      new THREE.MeshStandardMaterial({ map: rustTex, roughness: 0.85 })
    );
    roof.position.set(0, wallH + 0.2, 0);
    roof.castShadow = true;
    group.add(roof);
    group.updateMatrixWorld(true);
    walkableTops.push({ mesh: roof, box: new THREE.Box3().setFromObject(roof) });

    // 屋顶警示灯：常年废弃工厂里还亮着的一盏霓虹应急灯，青/品红随机，增加赛博夜色氛围
    var beaconColor = Math.random() < 0.5 ? 0x00e5ff : 0xff2f6d;
    var beaconLight = new THREE.PointLight(beaconColor, 0, 14);
    beaconLight.position.set(0, wallH + 0.7, 0);
    group.add(beaconLight);
    var beaconBulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.13, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0x050510, emissive: beaconColor, emissiveIntensity: 1 })
    );
    beaconBulb.position.copy(beaconLight.position);
    group.add(beaconBulb);
    beacons.push({ light: beaconLight, bulb: beaconBulb, phase: Math.random() * Math.PI * 2 });

    return group;
  }

  // 旋转角度只取 0/90/180/270 度：非轴对齐旋转会让轴对齐碰撞盒（AABB）比视觉模型大一圈，
  // 摸起来就像"空气墙"，所以大型建筑一律取直角朝向
  //
  // 整张地图按象限划成四个有明确主题的区域，出生点（0,10）在正中间的十字路口：
  // 西北＝锈蚀工厂区，东北＝农场，西南＝CS 风格白房子居民区，东南＝被占领的军事哨站。
  // 两座工厂放在西北，第三座挪到东南当"据点指挥部"
  buildFactory(-75, -68, 0, 28, 20);
  buildFactory(-28, -85, Math.PI / 2, 22, 16);
  buildFactory(60, 75, 0, 30, 20);

  /* ---------------- CS 经典地图风格的白房子群：平房 + 二层楼，跟锈蚀工厂拉开材质/体量差异 ---------------- */
  var plasterTex = makeNoiseTexture("#d8d2c4", 256, "#c7c0ae", "#eae4d6", 1400);
  plasterTex.repeat.set(2.4, 1.6);
  var plasterMat = new THREE.MeshStandardMaterial({ map: plasterTex, roughness: 0.8 });
  var houseRoofMat = new THREE.MeshStandardMaterial({ color: 0xb7ad94, roughness: 0.75 });

  // 单层白房子：矮墙 + 平顶，门口留缺口，体量比工厂小很多，用来填充地图中近距离交火的巷战空间
  function buildHouse(cx, cz, rotY, w, d) {
    var group = new THREE.Group();
    group.position.set(cx, 0, cz);
    group.rotation.y = rotY;
    scene.add(group);

    var wallH = 3.2, wallT = 0.5, doorGap = 2.2;
    function localWall(lw, lh, ld, lx, lz, ly) {
      var mesh = new THREE.Mesh(new THREE.BoxGeometry(lw, lh, ld), plasterMat);
      mesh.position.set(lx, (ly !== undefined ? ly : lh / 2), lz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      group.updateMatrixWorld(true);
      obstacles.push({ mesh: mesh, box: new THREE.Box3().setFromObject(mesh) });
    }
    var frontSeg = (w - doorGap) / 2;
    localWall(frontSeg, wallH, wallT, -(doorGap / 2 + frontSeg / 2), d / 2);
    localWall(frontSeg, wallH, wallT, (doorGap / 2 + frontSeg / 2), d / 2);
    localWall(w, wallH, wallT, 0, -d / 2);
    localWall(wallT, wallH, d, -w / 2, 0);
    localWall(wallT, wallH, d, w / 2, 0);
    // 窗洞两侧留矮墙垛意思一下，不做真正镂空（保持轴对齐碰撞盒简单可靠）
    localWall(w * 0.8, 0.5, wallT, 0, d / 2, wallH - 0.3);

    var roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.3, d + 0.6), houseRoofMat);
    roof.position.set(0, wallH + 0.15, 0);
    roof.castShadow = true;
    group.add(roof);
    group.updateMatrixWorld(true);
    walkableTops.push({ mesh: roof, box: new THREE.Box3().setFromObject(roof) });
    return group;
  }

  // 两层白房子：一楼墙 + 二楼墙叠起来，二楼墙体内收一圈露出一条"阳台"窗台线，视觉上明确读出两层楼，
  // 顶部同样登记为可站立平面——配合跳跃修复，二楼顶是很自然的制高点狙击位
  function buildTwoStory(cx, cz, rotY, w, d) {
    var group = new THREE.Group();
    group.position.set(cx, 0, cz);
    group.rotation.y = rotY;
    scene.add(group);

    var floorH = 3.0, wallT = 0.5, doorGap = 2.4;
    function localWall(lw, lh, ld, lx, ly, lz) {
      var mesh = new THREE.Mesh(new THREE.BoxGeometry(lw, lh, ld), plasterMat);
      mesh.position.set(lx, ly, lz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      group.updateMatrixWorld(true);
      obstacles.push({ mesh: mesh, box: new THREE.Box3().setFromObject(mesh) });
    }
    // 一楼：正面留门缺口
    var frontSeg = (w - doorGap) / 2;
    localWall(frontSeg, floorH, wallT, -(doorGap / 2 + frontSeg / 2), floorH / 2, d / 2);
    localWall(frontSeg, floorH, wallT, (doorGap / 2 + frontSeg / 2), floorH / 2, d / 2);
    localWall(w, floorH, wallT, 0, floorH / 2, -d / 2);
    localWall(wallT, floorH, d, -w / 2, floorH / 2, 0);
    localWall(wallT, floorH, d, w / 2, floorH / 2, 0);
    // 楼板（可以从一楼内部当天花板，也是二楼的地板，用同一块 box 兼顾两种视觉）
    var slab = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.3, d + 0.3), houseRoofMat);
    slab.position.set(0, floorH + 0.15, 0);
    slab.castShadow = true;
    group.add(slab);
    // 二楼：整圈墙体，正面留个窗洞形状的缺口（用两段矮墙夹出一个大窗）
    var winGap = doorGap + 1.2;
    var frontSeg2 = (w - winGap) / 2;
    var wallH2 = floorH + 2.6;
    localWall(frontSeg2, floorH, wallT, -(winGap / 2 + frontSeg2 / 2), wallH2 - floorH / 2, d / 2);
    localWall(frontSeg2, floorH, wallT, (winGap / 2 + frontSeg2 / 2), wallH2 - floorH / 2, d / 2);
    localWall(w, floorH, wallT, 0, wallH2 - floorH / 2, -d / 2);
    localWall(wallT, floorH, d, -w / 2, wallH2 - floorH / 2, 0);
    localWall(wallT, floorH, d, w / 2, wallH2 - floorH / 2, 0);

    var roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.3, d + 0.6), houseRoofMat);
    roof.position.set(0, wallH2 + 0.15, 0);
    roof.castShadow = true;
    group.add(roof);
    group.updateMatrixWorld(true);
    walkableTops.push({ mesh: roof, box: new THREE.Box3().setFromObject(roof) });
    // 楼板本身也能站（比如从窗口跳进二楼），一并登记
    walkableTops.push({ mesh: slab, box: new THREE.Box3().setFromObject(slab) });
    return group;
  }

  // 西南居民区：三栋平房 + 一栋二层楼围出一小片街区
  buildHouse(-75, 50, 0, 12, 10);

  /* ---------------- 医疗包：散布在地图上，靠近自动拾取回血 ---------------- */
  var healthPacks = [];

  function findPickupSpot() {
    for (var a = 0; a < 40; a++) {
      var px = rr(-HALF + 8, HALF - 8), pz = rr(-HALF + 8, HALF - 8);
      if (Math.hypot(px, pz - 10) < SAFE_R) continue;
      if (isClear(px, pz, 0.6)) return { x: px, z: pz };
    }
    return null;
  }
  for (var hpc = 0; hpc < 6; hpc++) {

  var HEALTH_PACK_HEAL = 45, HEALTH_PACK_R2 = 1.3 * 1.3;
  function playPickup() { playTone(520, 1040, 0.18, "sine", 0.22); }
  function updateHealthPacks(now) {
    for (var i = 0; i < healthPacks.length; i++) {
      var pack = healthPacks[i];
      if (!pack.active) continue;
      pack.group.position.y = 0.15 + Math.sin(now * 0.003 + pack.bobPhase) * 0.06;
      pack.group.rotation.y += 0.02;
      if (playerHP >= PLAYER_MAX_HP) continue;
      var dx = camera.position.x - pack.x, dz = camera.position.z - pack.z;
      if (dx * dx + dz * dz < HEALTH_PACK_R2) {
        playerHP = Math.min(PLAYER_MAX_HP, playerHP + HEALTH_PACK_HEAL);
        updateHpUI();
        pack.active = false;
        // 只隐藏网格 + 熄灭光照强度，不要隐藏整个 group（含 PointLight）——
        // 场景实时点光源数量一变，Three.js 会给所有受光照材质重新编译着色器，
        // 拾取瞬间就是这个"卡顿一下"的元凶
        for (var mi = 0; mi < pack.meshes.length; mi++) pack.meshes[mi].visible = false;
        pack.light.intensity = 0;
        playPickup();
      }
    }

  var PLAYER_HEIGHT = 1.85; // 判断能否从高处障碍物（比如工厂屋顶）下方穿过用，比视线高度 EYE_H 留一点余量
  var GROUND_REACH_MARGIN = 1.4; // 略大于最大跳跃高度：只把"够得着"的平面当作可能的落脚点，不然远高于头顶的屋顶会被当成地面直接把人吸上去

  // feetY 可选：
  // - 如果脚部高度已经不低于某个障碍物顶面（差一点误差内），当作"已经站在它上面"，不拿它当墙挡；
  // - 如果头顶高度已经完全在障碍物底面以下，当作"从它下方穿过"，同样不拿它当墙挡——
  //   这样屋顶这类悬空的大块碰撞体才能既挡住"跳上去"，又不挡住"从底下走进建筑"；
  // 不传 feetY 的调用（AI 寻路目标点、道具生成点等）按贴地（feetY=0）处理，同样能穿过悬空障碍物下方
  function isClear(x, z, r, feetY) {
    var effFeetY = feetY === undefined ? 0 : feetY;
    for (var i = 0; i < obstacles.length; i++) {
      var b = obstacles[i].box;
      if (x > b.min.x - r && x < b.max.x + r && z > b.min.z - r && z < b.max.z + r) {
        if (effFeetY >= b.max.y - 0.12) continue;
        if (effFeetY + PLAYER_HEIGHT <= b.min.y + 0.05) continue;
        return false;
      }
    }
    for (var j = 0; j < walkableTops.length; j++) {
      var wb = walkableTops[j].box;
      if (x > wb.min.x - r && x < wb.max.x + r && z > wb.min.z - r && z < wb.max.z + r) {
        if (effFeetY >= wb.max.y - 0.12) continue;
        if (effFeetY + PLAYER_HEIGHT <= wb.min.y + 0.05) continue;
        return false;
      }
    }
    return true;
  }
  // 某个 XZ 位置正下方能站的最高平面（掩体顶面或者地面本身），用来算跳跃落地高度/是否踩空掉落。
  // refY 传当前脚部高度：只有"够得着"（refY + 一点跳跃余量之内）的平面才算数，
  // 避免远高于头顶、只是纯粹装饰用不到的屋顶被当成"地面"，把走在建筑内部地面上的人直接吸到屋顶高度
  function groundHeightAt(x, z, refY) {
    var limit = refY === undefined ? Infinity : refY + GROUND_REACH_MARGIN;
    var h = 0;
    for (var i = 0; i < obstacles.length; i++) {
      var b = obstacles[i].box;
      if (x > b.min.x && x < b.max.x && z > b.min.z && z < b.max.z && b.max.y > h && b.max.y <= limit) h = b.max.y;
    }
    for (var j = 0; j < walkableTops.length; j++) {
      var wb = walkableTops[j].box;
      if (x > wb.min.x && x < wb.max.x && z > wb.min.z && z < wb.max.z && wb.max.y > h && wb.max.y <= limit) h = wb.max.y;
    }
    return h;
  }

  /* ---------------- 远景山脉（纯背景，不参与碰撞） ---------------- */
  (function buildMountains() {
    var mountainMat = new THREE.MeshStandardMaterial({ color: 0x6d7566, roughness: 1, flatShading: true, fog: true });
    var count = 30;
    var ringR = HALF + 60;
    // 山体底面半径（mw）之前最大能到 70，但相邻两座山沿环形分布的间距只有约 35——
    // 底面比间距还宽，必然大面积互相戳穿。缩小底面半径、收紧半径抖动范围，
    // 让相邻山峰只是自然地"肩并肩"衔接（轻微搭边形成连绵山脊），不再大段穿模
    for (var i = 0; i < count; i++) {
      var ang = (i / count) * Math.PI * 2 + rr(-0.12, 0.12);
      var r = ringR + rr(-10, 16);
      var mh = rr(34, 78);
      var mw = rr(14, 26);
      var mesh = new THREE.Mesh(new THREE.ConeGeometry(mw, mh, 5 + ((Math.random() * 3) | 0)), mountainMat);
      mesh.position.set(Math.sin(ang) * r, mh / 2 - 6, Math.cos(ang) * r);
      mesh.rotation.y = rr(0, Math.PI * 2);
      mesh.scale.x = rr(0.9, 1.15);
      scene.add(mesh);
    }
  })();

  /* ---------------- 树木（树干参与碰撞）+ 灌木（纯装饰） ---------------- */
  var treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3826, roughness: 0.9 });
  function addTree(x, z) {
    var group = new THREE.Group();
    var trunkH = rr(2.2, 3.6);
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.22, trunkH, 6), treeTrunkMat);
    trunk.position.y = trunkH / 2;
    trunk.castShadow = true;
    trunk.receiveShadow = true;
    group.add(trunk);
    var leafColor = new THREE.Color(0x3f5a2c);
    leafColor.offsetHSL(rr(-0.02, 0.02), rr(-0.1, 0.1), rr(-0.08, 0.08));
    var leafMat = new THREE.MeshStandardMaterial({ color: leafColor, roughness: 0.95, flatShading: true });
    var tiers = 2 + (Math.random() < 0.5 ? 1 : 0);
    var ty = trunkH * 0.55;
    for (var t = 0; t < tiers; t++) {
      var tw = rr(1.1, 1.7) * (1 - t * 0.2);
      var th = rr(1.5, 2.1);
      var cone = new THREE.Mesh(new THREE.ConeGeometry(tw, th, 7), leafMat);
      cone.position.y = ty + th * 0.42;
      cone.castShadow = true;
      cone.receiveShadow = true;
      group.add(cone);
      ty += th * 0.62;
    }
    group.position.set(x, 0, z);
    group.rotation.y = rr(0, Math.PI * 2);
    scene.add(group);
    // 只用树干做碰撞（细长圆柱），枝叶部分不挡视线/子弹，免得变成又一种"空气墙"
    var box = new THREE.Box3(
      new THREE.Vector3(x - 0.45, 0, z - 0.45),
      new THREE.Vector3(x + 0.45, trunkH, z + 0.45)
    );
    obstacles.push({ mesh: trunk, box: box });
  }
  function addBush(x, z) {
    var color = new THREE.Color(0x455c2e);
    color.offsetHSL(rr(-0.03, 0.03), rr(-0.1, 0.1), rr(-0.1, 0.1));
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 1, flatShading: true });
    var group = new THREE.Group();
    var blobs = 3 + (Math.random() < 0.5 ? 1 : 0);
    for (var i = 0; i < blobs; i++) {
      var s = rr(0.32, 0.58);
      var blob = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), mat);
      blob.position.set(rr(-0.3, 0.3), s * 0.7, rr(-0.3, 0.3));
      blob.castShadow = true;
      blob.receiveShadow = true;
      group.add(blob);
    }
    group.position.set(x, 0, z);
    scene.add(group);
  }
  var TREE_COUNT = 32, BUSH_COUNT = 28;
  for (var ti = 0; ti < TREE_COUNT; ti++) {
    var tx, tz, tTries = 0;
    do {
      tx = rr(-HALF + 8, HALF - 8);
      tz = rr(-HALF + 8, HALF - 8);
      tTries++;
    } while ((!isClear(tx, tz, 1.6) || Math.hypot(tx, tz - 10) < SAFE_R) && tTries < 20);
    if (tTries < 20) addTree(tx, tz);
  }
  for (var bi = 0; bi < BUSH_COUNT; bi++) {
    var bx, bz, bTries = 0;
    do {
      bx = rr(-HALF + 6, HALF - 6);
      bz = rr(-HALF + 6, HALF - 6);
      bTries++;
    } while ((!isClear(bx, bz, 0.8) || Math.hypot(bx, bz - 10) < SAFE_R) && bTries < 20);
    if (bTries < 20) addBush(bx, bz);
  }

  var PLAYER_R = 0.4, MOVE_SPEED = 6.2;

  function canMoveTo(x, z) { return isClear(x, z, PLAYER_R, feetY); }

  function attemptMove(dx, dz) {
    var nx = camera.position.x + dx;
    if (canMoveTo(nx, camera.position.z)) camera.position.x = nx;
    var nz = camera.position.z + dz;
    if (canMoveTo(camera.position.x, nz)) camera.position.z = nz;
  }

  /* ---------------- 人形敌人（部位伤害 + 血量 + AI 反击） ---------------- */
  var ENEMY_COUNT = 14;
  var ENEMY_MAX_HP = 100;
  var DAMAGE = currentWeapon.damage;
  var enemies = [];
  var remainingEnemies = ENEMY_COUNT;

  function findEnemySpot() {
    for (var a = 0; a < 40; a++) {
      var x = rr(-HALF + 6, HALF - 6), z = rr(-HALF + 6, HALF - 6);
      if (Math.hypot(x, z - 10) < SAFE_R) continue;
      if (isClear(x, z, 0.6)) return { x: x, z: z };
    }
    return { x: rr(-HALF + 10, HALF - 10), z: rr(-HALF + 10, HALF - 10) };
  }

  // 挂在骨骼上的隐形命中判定盒：每帧从骨骼世界坐标同步位置，这样跑动动画时头/躯干/四肢
  // 的判定范围会跟着动作走，同时不需要对蒙皮网格本身做骨骼姿态下的射线检测
  var ENEMY_HITBOX_SPECS = [
    { bone: "mixamorigHead", tag: "head", size: [0.26, 0.28, 0.26], offsetY: 0.06 },
    { bone: "mixamorigSpine1", tag: "torso", size: [0.42, 0.5, 0.28], offsetY: 0.12 },
    { bone: "mixamorigLeftArm", tag: "limb", size: [0.14, 0.55, 0.14], offsetY: -0.2 },
    { bone: "mixamorigRightArm", tag: "limb", size: [0.14, 0.55, 0.14], offsetY: -0.2 },
    { bone: "mixamorigLeftUpLeg", tag: "limb", size: [0.17, 0.85, 0.17], offsetY: -0.38 },
    { bone: "mixamorigRightUpLeg", tag: "limb", size: [0.17, 0.85, 0.17], offsetY: -0.38 },
  ];

  function createEnemy() {
    var group = new THREE.Group();
    var parts = [];
    var rightArm = null, gun = null, mixer = null, charMaterial = null, animState = null;

    if (CHAR) {
      var charRoot = THREE.SkeletonUtils.clone(CHAR.scene);
      charRoot.rotation.y = Math.PI; // 绑定姿势朝 +Z，转 180° 对齐原有朝向约定
      var surfaceMesh = null;
      charRoot.traverse(function (o) {
        if (o.name === "Beta_Joints") o.visible = false;
        if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
        if (o.name === "Beta_Surface") surfaceMesh = o;
      });
      if (surfaceMesh) {
        // 军服颜色做小幅随机偏移，避免 14 个敌人长得一模一样
        var uniformColor = new THREE.Color(0x8a3226);
        uniformColor.offsetHSL(rr(-0.03, 0.03), rr(-0.1, 0.1), rr(-0.08, 0.08));
        charMaterial = surfaceMesh.material.clone();
        charMaterial.color.copy(uniformColor);
        surfaceMesh.material = charMaterial;
      }
      group.add(charRoot);

      if (CLIPS.crouchRun) {
        mixer = new THREE.AnimationMixer(charRoot);
        animState = buildActionState(mixer);
        playAction(animState, animState.actions.idle ? "idle" : "crouchRun");
        mixer.update(0); // 先摆出一个正常持枪姿势，挂枪量朝向要用这个姿势而不是骨架的绑定 T-pose
      }

      // 手枪要挂在骨骼摆出真实持枪姿势之后再量朝向：绑定姿势（T-pose）跟端枪的手部朝向完全不一样，
      // 挂太早算出来的旋转会离谱地偏
      var handBone = findBoneExact(charRoot, "mixamorigRightHand");
      if (handBone) {
        var gunMat = new THREE.MeshStandardMaterial({ color: 0x2a281f, roughness: 0.6 });
        gun = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.5), gunMat);
        gun.position.set(0, 0.02, 0.22);
        gun.castShadow = true;
        handBone.add(gun);
        orientGunToHand(handBone, gun);
      }

      if (mixer) {
        mixer.update(rr(0, 2)); // 随机起始相位，避免所有敌人动作完全同步
        animState.nextProneAt = performance.now() + rr(3000, 9000);
      }

      for (var b = 0; b < ENEMY_HITBOX_SPECS.length; b++) {
        var spec = ENEMY_HITBOX_SPECS[b];
        var bone = findBoneExact(charRoot, spec.bone);
        if (!bone) continue;
        var hbMat = new THREE.MeshBasicMaterial();
        hbMat.visible = false; // 不参与渲染，但仍能被 Raycaster 命中
        var hb = new THREE.Mesh(new THREE.BoxGeometry(spec.size[0], spec.size[1], spec.size[2]), hbMat);
        hb.castShadow = false;
        hb.receiveShadow = false;
        group.add(hb);
        parts.push({ mesh: hb, tag: spec.tag, bone: bone, offsetY: spec.offsetY });
      }
    } else {
      // 模型加载失败时的后备方案：程序化箱体人形
      var uniformColor2 = new THREE.Color(0x3c4131);
      uniformColor2.offsetHSL(rr(-0.03, 0.03), rr(-0.1, 0.1), rr(-0.06, 0.06));
      var skinColor = new THREE.Color([0xb98a63, 0x8a6244, 0xd9a876][(Math.random() * 3) | 0]);
      var accentColor = 0xc23b2a;
      var uniformMat = new THREE.MeshStandardMaterial({ color: uniformColor2, roughness: 0.75 });
      var skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.8 });
      var accentMat = new THREE.MeshStandardMaterial({ color: accentColor, roughness: 0.5, emissive: 0x330a05, emissiveIntensity: 0.4 });

      function part(geo, mat, x, y, z, tag) {
        var mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
        parts.push({ mesh: mesh, tag: tag });
        return mesh;
      }

      part(new THREE.BoxGeometry(0.5, 0.72, 0.3), uniformMat, 0, 1.12, 0, "torso");
      part(new THREE.SphereGeometry(0.16, 10, 10), skinMat, 0, 1.66, 0, "head");
      part(new THREE.BoxGeometry(0.1, 0.08, 0.32), accentMat, 0, 1.72, 0.02, "head"); // 头带（视觉识别）
      part(new THREE.BoxGeometry(0.14, 0.52, 0.14), uniformMat, -0.32, 1.05, 0, "limb");
      rightArm = part(new THREE.BoxGeometry(0.14, 0.52, 0.14), uniformMat, 0.32, 1.05, 0, "limb");
      part(new THREE.BoxGeometry(0.17, 0.75, 0.17), uniformMat, -0.14, 0.38, 0, "limb");
      part(new THREE.BoxGeometry(0.17, 0.75, 0.17), uniformMat, 0.14, 0.38, 0, "limb");
      part(new THREE.SphereGeometry(0.045, 6, 6), accentMat, 0, 1.32, 0.16, "torso"); // 胸前指示灯
      if (Math.random() < 0.5) {
        part(new THREE.BoxGeometry(0.32, 0.4, 0.16), uniformMat, 0, 1.1, -0.22, "torso"); // 背包（外观差异化）
      }

      // 持枪的右臂：枪身挂在手臂上一起动，开火时手臂会摆动
      var gunMat2 = new THREE.MeshStandardMaterial({ color: 0x2a281f, roughness: 0.6 });
      gun = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.42), gunMat2);
      gun.position.set(0.05, -0.15, 0.28);
      gun.castShadow = true;
      rightArm.add(gun);
      rightArm.rotation.x = -0.15; // 平时端枪的姿态，不再完全站直木然
    }

    // 敌方识别灯：头顶一颗常亮的品红色小灯（配一点点光），跟 Bloom 配合，
    // 不管天气/光照多暗，敌人的轮廓可能糊在暗背景里，这颗灯始终是清晰的亮点——
    // 军用 HUD 敌我识别灯（IFF）的思路，直接解决"看不清敌人在哪"的问题
    var iffBulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0x1a0510, emissive: 0xff2f6d, emissiveIntensity: 2.2 })
    );
    iffBulb.position.set(0, 1.9, 0);
    group.add(iffBulb);
    var iffLight = new THREE.PointLight(0xff2f6d, 0.6, 5);
    iffLight.position.copy(iffBulb.position);
    group.add(iffLight);

    var pos = findEnemySpot();
    group.position.set(pos.x, 0, pos.z);
    group.rotation.y = rr(0, Math.PI * 2);
    scene.add(group);

    return {
      group: group,
      parts: parts,
      rightArm: rightArm,
      gun: gun,
      mixer: mixer,
      animState: animState,
      mixerDone: false,
      charMaterial: charMaterial,
      hp: ENEMY_MAX_HP,
      alive: true,
      nextFireTime: performance.now() + rr(500, 2500),
      homeX: pos.x,
      homeZ: pos.z,
      moveTarget: null,
      nextMoveTime: performance.now() + rr(500, 2000),
      attackAnimStart: null,
      aggro: false,
      aggroUntil: 0,
      nextAggroRetarget: 0,
    };
  }
  for (var e = 0; e < ENEMY_COUNT; e++) enemies.push(createEnemy());

  function allEnemyPartMeshes() {
    var list = [];
    for (var i = 0; i < enemies.length; i++) {
      if (!enemies[i].alive) continue;
      var ps = enemies[i].parts;
      for (var j = 0; j < ps.length; j++) list.push(ps[j].mesh);
    }
    return list;
  }
  function findEnemyByMesh(mesh) {
    for (var i = 0; i < enemies.length; i++) {
      if (!enemies[i].alive) continue;
      var ps = enemies[i].parts;
      for (var j = 0; j < ps.length; j++) {
        if (ps[j].mesh === mesh) return { enemy: enemies[i], tag: ps[j].tag };
      }
    }
    return null;
  }

  var scoreEl = document.getElementById("score-val");
  var targetEl = document.getElementById("target-val");
  var hpEl = document.getElementById("hp-bar-val");
  var hpBarFillEl = document.getElementById("hp-bar-fill");
  var hpBarWrapEl = document.getElementById("hp-bar-wrap");
  var ammoEl = document.getElementById("ammo-val");
  var headshotPopup = document.getElementById("headshot-popup");
  var hitFlashEl = document.getElementById("hit-flash");

    targetEl.textContent = remainingEnemies;
  }
  updateTargetInfo();

  function killEnemy(enemy) {
    enemy.alive = false;
    remainingEnemies--;
    score++;
    scoreEl.textContent = score;
    updateTargetInfo();

    if (enemy.animState && enemy.animState.actions.dying) {
      playAction(enemy.animState, "dying", { once: true, fade: 0.1 });
    }

    var startY = enemy.group.position.y;
    var hasDeathAnim = !!(enemy.animState && enemy.animState.actions.dying);
    effects.push({
      obj: enemy.group,
      start: performance.now(),
      duration: hasDeathAnim ? 1900 : 420, // 有骨骼死亡动作的话让尸体多停留一下，看得清倒地过程
      update: function (t) {
        if (hasDeathAnim) {
          // 倒地过程完全交给骨骼动画表现；只在最后一小段时间让尸体整体沉入地面再消失
          if (t > 0.8) {
            var k = (t - 0.8) / 0.2;
            enemy.group.position.y = startY - k * 1.3;
          }
        } else {
          enemy.group.position.y = startY - t * 1.6;
          enemy.group.rotation.x = t * 1.1;
          enemy.group.scale.setScalar(1 - t * 0.25);
        }
      },
      dispose: function () {
        enemy.mixerDone = true;
        for (var i = 0; i < enemy.parts.length; i++) {
          enemy.parts[i].mesh.geometry.dispose();
          enemy.parts[i].mesh.material.dispose();
        }
        if (enemy.gun) {
          enemy.gun.geometry.dispose();
          enemy.gun.material.dispose();
        }
        if (enemy.charMaterial) enemy.charMaterial.dispose(); // 蒙皮网格几何体是所有敌人共用的模板，不能 dispose，只清理每个实例克隆出来的材质
      },
    });

    if (remainingEnemies <= 0) {
      setTimeout(function () { endGame(true); }, 500);
    }
  }

  function damageEnemy(enemy, tag, hitPoint) {
    var dmg = DAMAGE[tag] || DAMAGE.limb;
    enemy.hp -= dmg;
    playHit();

    if (tag === "head") {

      clearTimeout(headshotPopup._t);
      headshotPopup._t = setTimeout(function () { headshotPopup.classList.remove("show"); }, 420);
    }
    if (enemy.hp <= 0) {

    } else {

      enemy.aggro = true;
      enemy.aggroUntil = performance.now() + rr(5000, 8000);
      enemy.moveTarget = null;
      enemy.nextMoveTime = 0;
    }
  }

  /* ---------------- 玩家生命值 ---------------- */
  var PLAYER_MAX_HP = 100;
  var playerHP = PLAYER_MAX_HP;

  function updateHpUI() {
    var hp = Math.max(0, Math.round(playerHP));
    var low = playerHP <= 30;
    hpEl.textContent = hp;
    hpEl.classList.toggle("low", low);
    hpBarFillEl.style.width = Math.max(0, playerHP / PLAYER_MAX_HP * 100) + "%";

  updateHpUI();

  var dmgIndicatorsEl = document.getElementById("dmg-indicators");
  function showDamageDirection(sourcePos) {
    if (!sourcePos) return;
    var toSource = new THREE.Vector2(sourcePos.x - camera.position.x, sourcePos.z - camera.position.z);
    if (toSource.lengthSq() < 0.0001) return;
    toSource.normalize();
    var fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    var rx = Math.cos(yaw), rz = -Math.sin(yaw);
    var forwardComp = toSource.x * fx + toSource.y * fz;
    var rightComp = toSource.x * rx + toSource.y * rz;
    var bearingDeg = Math.atan2(rightComp, forwardComp) * 180 / Math.PI;

    var arrow = document.createElement("div");
    arrow.className = "dmg-arrow";
    arrow.style.transform = "rotate(" + bearingDeg + "deg) translateY(-90px)";
    var glow = document.createElement("div");
    glow.className = "dmg-arrow-glow";
    arrow.appendChild(glow);
    dmgIndicatorsEl.appendChild(arrow);
    setTimeout(function () { arrow.remove(); }, 1000);
  }

  function damagePlayer(amount, sourcePos) {
    if (!gameActive) return;
    playerHP -= amount;
    playHurt();
    hitFlashEl.classList.add("show");
    setTimeout(function () { hitFlashEl.classList.remove("show"); }, 90);
    showDamageDirection(sourcePos);
    if (playerHP <= 0) {
      playerHP = 0;
      updateHpUI();
      endGame(false);
      return;
    }
    updateHpUI();
  }

  /* ---------------- Web Audio 合成音效 ---------------- */
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function playTone(freqStart, freqEnd, dur, type, vol) {
    var ctx = ensureAudio(), now = ctx.currentTime;
    var osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, now);
    osc.frequency.exponentialRampToValueAtTime(freqEnd, now + dur);
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur + 0.01);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }
  function playNoise(dur, vol, filterFreq, filterType) {
    var ctx = ensureAudio(), now = ctx.currentTime;
    var bufferSize = Math.floor(ctx.sampleRate * dur);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filt = ctx.createBiquadFilter();
    filt.type = filterType || "bandpass";
    filt.frequency.value = filterFreq;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    noise.connect(filt).connect(gain).connect(ctx.destination);
    noise.start(now); noise.stop(now + dur + 0.01);
  }
  function playShot() {
    playNoise(0.1, 0.45, 1200, "bandpass");
    playTone(120, 48, 0.08, "sine", 0.35);
  }
  function playEnemyShot() {
    playNoise(0.09, 0.22, 700, "bandpass");
  }
  function playHit() { playTone(880, 440, 0.1, "square", 0.2); }
  function playHurt() { playTone(180, 80, 0.18, "sawtooth", 0.25); }
  function playReload() {
    playNoise(0.03, 0.12, 2200, "highpass");
    setTimeout(function () { playNoise(0.04, 0.14, 1800, "highpass"); }, 260);
  }
  function playFootstep() { playNoise(0.06, 0.16, 350, "lowpass"); }
  function playLand() { playNoise(0.1, 0.24, 200, "lowpass"); }
  function playVictory() {
    playTone(440, 660, 0.18, "triangle", 0.22);
    setTimeout(function () { playTone(660, 880, 0.22, "triangle", 0.22); }, 160);
  }
  function playDefeat() { playTone(220, 70, 0.5, "sawtooth", 0.22); }

  /* ---------------- 射击特效：枪口闪光 / 弹道 / 命中火花 ---------------- */
  var effects = [];
  // 枪口火光贴图：径向渐变的一小团亮光，中心接近纯白、边缘发橙后透明，配合叠加混合让它在任何背景下都够醒目
  var flashTexture = (function () {
    var c = document.createElement("canvas");
    c.width = c.height = 64;
    var ctx = c.getContext("2d");
    var g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.22, "rgba(255,235,170,0.95)");
    g.addColorStop(0.55, "rgba(255,150,40,0.55)");
    g.addColorStop(1, "rgba(255,90,20,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();

  // 第一人称用第一人称枪口，第三人称用挂在过肩可见人物手上那把枪的枪口——
  // 不然第三人称下枪口火光/弹道永远从看不见的第一人称枪（屏幕中心附近）冒出来，跟画面里的人物对不上
  function getMuzzlePoint() {
    var p = new THREE.Vector3();
    (viewMode === "tp" ? tpMuzzleTip : muzzleTip).getWorldPosition(p);
    return p;
  }
  function spawnMuzzleFlash() {
    var pos = getMuzzlePoint(); // 火光要在真实枪口位置，而不是屏幕中心附近

    var light = new THREE.PointLight(0x5ff2ff, 3, 6);
    light.position.copy(pos);
    scene.add(light);
    effects.push({
      obj: light, start: performance.now(), duration: 55,
      update: function (t) { light.intensity = 3 * (1 - t); },
    });

    // 光源只是照亮周围，真正让开火"看得见"的是这个叠加混合的亮斑精灵；玩家用青色、敌人用品红，
    // 一眼就能分清子弹是谁打的
    var mat = new THREE.SpriteMaterial({
      map: flashTexture, color: 0x8ff5ff, transparent: true, opacity: 1,
      depthWrite: false, blending: THREE.AdditiveBlending, rotation: Math.random() * Math.PI * 2,
    });
    var sprite = new THREE.Sprite(mat);
    sprite.position.copy(pos);
    sprite.scale.set(0.42, 0.42, 1);
    scene.add(sprite);
    effects.push({
      obj: sprite, start: performance.now(), duration: 65,
      update: function (t) {
        var k = 1 - t;
        var s = 0.42 * (0.55 + k * 0.7);
        sprite.scale.set(s, s, 1);
        mat.opacity = k;
      },
      dispose: function () { mat.dispose(); },
    });
  }
  function spawnTracer(from, to, color) {
    var geometry = new THREE.BufferGeometry().setFromPoints([from, to]);
    var material = new THREE.LineBasicMaterial({ color: color || 0x9ff4ff, transparent: true, opacity: 0.9 });
    var line = new THREE.Line(geometry, material);
    scene.add(line);
    effects.push({
      obj: line, start: performance.now(), duration: 90,
      update: function (t) { material.opacity = 0.9 * (1 - t); },
      dispose: function () { geometry.dispose(); material.dispose(); },
    });
  }
  function spawnHitSpark(position) {
    var geometry = new THREE.SphereGeometry(0.07, 6, 6);
    var material = new THREE.MeshBasicMaterial({ color: 0xffcf6b, transparent: true, opacity: 1 });
    var spark = new THREE.Mesh(geometry, material);
    spark.position.copy(position);
    scene.add(spark);
    effects.push({
      obj: spark, start: performance.now(), duration: 220,
      update: function (t) { spark.scale.setScalar(1 + t * 4); material.opacity = 1 - t; },
      dispose: function () { geometry.dispose(); material.dispose(); },
    });
  }
  // 打在掩体/地面上的弹痕：贴合命中面法线的小圆点，永久保留（超过上限后淘汰最早的），
  // 几何体和材质在所有弹痕之间共用，新增/淘汰都不用额外创建或释放显存资源
  var decalGeometry = new THREE.CircleGeometry(0.055, 8);
  var decalMaterial = new THREE.MeshBasicMaterial({
    color: 0x161310, transparent: true, opacity: 0.82, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4,
  });
  var decals = [];
  var MAX_DECALS = 70;
  var __decalNormal = new THREE.Vector3();
  var __decalUp = new THREE.Vector3(0, 0, 1);
  function spawnBulletDecal(hit) {
    if (!hit.face) return;
    __decalNormal.copy(hit.face.normal).transformDirection(hit.object.matrixWorld).normalize();
    var mesh = new THREE.Mesh(decalGeometry, decalMaterial);
    mesh.position.copy(hit.point).addScaledVector(__decalNormal, 0.01);
    mesh.quaternion.setFromUnitVectors(__decalUp, __decalNormal);
    mesh.rotateZ(Math.random() * Math.PI * 2);
    scene.add(mesh);
    decals.push(mesh);
    if (decals.length > MAX_DECALS) scene.remove(decals.shift());
  }

  function updateEffects() {
    var now = performance.now();
    for (var i = effects.length - 1; i >= 0; i--) {
      var eff = effects[i];
      var t = (now - eff.start) / eff.duration;
      if (t >= 1) {
        scene.remove(eff.obj);
        if (eff.dispose) eff.dispose();
        effects.splice(i, 1);
      } else {
        eff.update(Math.min(t, 1));
      }
    }
  }

  var crosshairFlashTimeout;

  }

  /* ---------------- 弹匣 / 换弹 ---------------- */
  var MAG_SIZE = currentWeapon.magSize;
  var currentAmmo = MAG_SIZE;
  var isReloading = false;
  var RELOAD_MS = currentWeapon.reloadMs;

  function updateAmmoUI() {
    if (isReloading) {

      ammoEl.classList.add("reloading");
      ammoEl.classList.remove("low");

  updateAmmoUI();

  function startReload() {
    if (isReloading || currentAmmo === MAG_SIZE || !gameActive) return;

    triggerReloadAnim(playerAnimState);

  var raycaster = new THREE.Raycaster();

  function applyWeapon(key) {
    var w = WEAPONS[key];
    if (!w) return;
    currentWeapon = w;
    DAMAGE = w.damage;
    MAG_SIZE = w.magSize;
    FIRE_CD = w.fireCd;
    RELOAD_MS = w.reloadMs;
    currentAmmo = MAG_SIZE;
    isReloading = false;
    updateAmmoUI();

  }

  // 人物皮肤：没有单独的换装贴图/模型，做法是直接改第三人称军服材质的颜色——
  // 低成本但够用，商店里先只放几种纯色方案
  var SKINS = {
    urban: { key: "urban", name: "都市蓝", color: 0x3d5266 },
    desert: { key: "desert", name: "荒漠棕", color: 0x8a6a45 },
    arctic: { key: "arctic", name: "极地白", color: 0xc9cdd6 },
    stealth: { key: "stealth", name: "暗夜黑", color: 0x1c1e24 },
    cyber: { key: "cyber", name: "赛博红", color: 0xb8263f },
  };
  var currentSkin = SKINS.urban;
  function applySkin(key) {
    var s = SKINS[key];
    if (!s) return;
    currentSkin = s;
    if (playerSkinMaterial) playerSkinMaterial.color.set(s.color);
    // 第一人称主要看得到的是枪，不是自己身体，枪身材质也要一起着色，不然玩家会觉得"点了没反应"
    for (var g = 0; g < gunSkinMaterials.length; g++) gunSkinMaterials[g].color.set(s.color);
  }

  function shoot() {
    if (!gameActive || isReloading) return;
    var now = performance.now();
    if (now - lastFire < FIRE_CD) return;
    if (currentAmmo <= 0) { startReload(); return; }
    lastFire = now;
    currentAmmo--;
    updateAmmoUI();
    gunRecoil = 1;

    playShot();
    spawnMuzzleFlash();
    flashReticle();
    triggerFireAnim(playerAnimState);

    raycaster.far = currentWeapon.range; // 武器有效射程：超出这个距离，命中判定直接不计入
    raycaster.setFromCamera(center, camera);
    var targets = obstacles.map(function (o) { return o.mesh; }).concat(allEnemyPartMeshes());
    var hits = raycaster.intersectObjects(targets, false);

    // 弹道要从真实枪口位置发出，而不是瞄准点/相机中心；第三人称下用挂在可见人物手上那把枪的枪口
    var muzzlePoint = getMuzzlePoint();
    var fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    var tracerEnd = hits.length ? hits[0].point : camera.position.clone().add(fwd.clone().multiplyScalar(currentWeapon.range));
    spawnTracer(muzzlePoint, tracerEnd);

    if (currentAmmo === 0) startReload();
    if (!hits.length) return;

    var found = findEnemyByMesh(hits[0].object);
    if (found) {
      damageEnemy(found.enemy, found.tag, hits[0].point);
    } else {
      spawnBulletDecal(hits[0]); // 打在掩体/地面上留个弹痕，打中敌人则不留（有命中火花反馈了）
    }
  }

  /* ---------------- 敌人 AI：视线内定期反击（带开火动作） ---------------- */
  var ENEMY_RANGE = 46;
  var ENEMY_HIT_CHANCE = 0.5;
  var enemyRay = new THREE.Raycaster();
  function spawnMuzzleFlashAt(position, color) {
    var light = new THREE.PointLight(color || 0xff2f6d, 2.6, 6);
    light.position.copy(position);
    scene.add(light);
    effects.push({
      obj: light, start: performance.now(), duration: 70,
      update: function (t) { light.intensity = 2.6 * (1 - t); },
    });

    // 敌人开火也用跟玩家一样的叠加混合亮斑精灵，不然隔着一段距离基本看不出"对方在开枪"
    var mat = new THREE.SpriteMaterial({
      map: flashTexture, color: color || 0xff2f6d, transparent: true, opacity: 1,
      depthWrite: false, blending: THREE.AdditiveBlending, rotation: Math.random() * Math.PI * 2,
    });
    var sprite = new THREE.Sprite(mat);
    sprite.position.copy(position);
    sprite.scale.set(0.5, 0.5, 1);
    scene.add(sprite);
    effects.push({
      obj: sprite, start: performance.now(), duration: 90,
      update: function (t) {
        var k = 1 - t;
        var s = 0.5 * (0.55 + k * 0.7);
        sprite.scale.set(s, s, 1);
        mat.opacity = k;
      },
      dispose: function () { mat.dispose(); },
    });
  }
  function updateEnemyAI() {
    if (!gameActive) return;
    var now = performance.now();
    var obstacleMeshes = obstacles.map(function (o) { return o.mesh; });
    for (var i = 0; i < enemies.length; i++) {
      var en = enemies[i];
      if (!en.alive || now < en.nextFireTime) continue;
      en.nextFireTime = now + rr(1500, 3200);

      var eyePos = en.group.position.clone().add(new THREE.Vector3(0, 1.5, 0));
      var toPlayer = camera.position.clone().sub(eyePos);
      var dist = toPlayer.length();
      if (dist > ENEMY_RANGE) continue;
      toPlayer.normalize();

      // 视野盲区：玩家得在敌人朝向前方大致 120° 的锥形范围内才可能被发现/攻击，
      // 不然背对着玩家、或者玩家绕到侧后方，敌人还是照样能精确开枪，非常不讲道理；
      // 之前是 140°、且这个判断在敌人转身/移动逻辑跑之前执行，读到的朝向是上一帧的，
      // 玩家眼里就是"明明没朝我"却还能中弹——现在收紧角度，且转身逻辑已经挪到这前面先跑一遍
      var facingX = -Math.sin(en.group.rotation.y), facingZ = -Math.cos(en.group.rotation.y);
      var facingDot = facingX * toPlayer.x + facingZ * toPlayer.z;
      if (facingDot < 0.5) continue;

      enemyRay.set(eyePos, toPlayer);
      var blocks = enemyRay.intersectObjects(obstacleMeshes, false);
      if (blocks.length && blocks[0].distance < dist - 0.5) continue; // 视线被掩体挡住

      // 开火动作：骨骼动画播一次射击抖动 + 枪口闪光 + 弹道
      en.attackAnimStart = now;
      triggerFireAnim(en.animState);
      en.group.updateMatrixWorld(true); // 强制刷新，枪口世界坐标不用上一帧残留的矩阵
      var gunWorldPos = new THREE.Vector3();
      en.gun.getWorldPosition(gunWorldPos);
      spawnMuzzleFlashAt(gunWorldPos, 0xff2f6d);
      spawnTracer(gunWorldPos, camera.position.clone(), 0xff2f6d);
      playEnemyShot();
      if (Math.random() < ENEMY_HIT_CHANCE) {
        damagePlayer(rr(6, 16), en.group.position);
      }
    }
  }

  /* ---------------- 敌人巡逻移动 + 开火动作缓动（不再是静止靶） ---------------- */
  var ENEMY_MOVE_SPEED = 1.6;
  var ENEMY_AGGRO_SPEED = 2.6;
  var ENEMY_ENGAGE_DIST = 9;
  var ENEMY_PATROL_RADIUS = 11;
  function updateEnemyMovement(dt) {
    if (!gameActive) return;
    var now = performance.now();
    for (var i = 0; i < enemies.length; i++) {
      var en = enemies[i];
      if (!en.alive) continue;

      if (en.rightArm && en.attackAnimStart !== null) {
        // 仅程序化后备模型才有独立的手臂骨骼可以手动摆动；GLTF 骨骼动画由 AnimationMixer 驱动，不走这条分支
        var at = (now - en.attackAnimStart) / 220;
        if (at >= 1) {
          en.rightArm.rotation.x = -0.15;
          en.attackAnimStart = null;
        } else {
          var k = at < 0.4 ? at / 0.4 : 1 - (at - 0.4) / 0.6;
          // 手臂旋转轴心在几何中心而非肩部，幅度不宜过大，否则会显得手臂穿模；
          // 保持一个能看出来"在开火"的快速抖动即可
          en.rightArm.rotation.x = -0.15 - k * 0.38;
        }
      }

      if (en.aggro && now > en.aggroUntil) {
        en.aggro = false;
        en.moveTarget = null;
        en.nextMoveTime = now + rr(300, 1200);
      }

      if (en.aggro) {
        // 警戒状态：放弃巡逻点位，定期朝玩家当前位置重新取目标，但保持一定接战距离，不贴脸
        if (now > en.nextAggroRetarget) {
          en.nextAggroRetarget = now + rr(500, 900);
          var toPlayerX = camera.position.x - en.group.position.x;
          var toPlayerZ = camera.position.z - en.group.position.z;
          var distToPlayer = Math.hypot(toPlayerX, toPlayerZ);
          if (distToPlayer > ENEMY_ENGAGE_DIST) {
            var ux = toPlayerX / distToPlayer, uz = toPlayerZ / distToPlayer;
            // 目标点不用预先校验是否 isClear：逐步移动时每一步都会做碰撞检测，
            // 真撞上掩体会自然停下，不会穿模；提前校验反而会让目标点恰好落在障碍物里时敌人卡住不动
            en.moveTarget = {
              x: camera.position.x - ux * ENEMY_ENGAGE_DIST,
              z: camera.position.z - uz * ENEMY_ENGAGE_DIST,
            };
          } else {
            en.moveTarget = null; // 已经够近了，原地交火
          }
        }
        if (!en.moveTarget) {
          // 原地交火时移动那条"边走边转朝向"的逻辑不会跑，得单独让它转身正对玩家——
          // 不然敌人可能保持着巡逻时最后一次走动的朝向开枪，看起来像"背对着也能打中"
          var faceX = camera.position.x - en.group.position.x;
          var faceZ = camera.position.z - en.group.position.z;
          en.group.rotation.y = Math.atan2(-faceX, -faceZ);
        }
      } else if (!en.moveTarget && now > en.nextMoveTime) {
        var tries = 0, tx, tz, found = false;
        while (tries < 8) {
          tx = en.homeX + rr(-ENEMY_PATROL_RADIUS, ENEMY_PATROL_RADIUS);
          tz = en.homeZ + rr(-ENEMY_PATROL_RADIUS, ENEMY_PATROL_RADIUS);
          tries++;
          if (isClear(tx, tz, 0.6)) { found = true; break; }
        }
        if (found) en.moveTarget = { x: tx, z: tz };
        en.nextMoveTime = now + rr(1200, 2800);
      }

      if (en.moveTarget) {
        var moveSpeed = en.aggro ? ENEMY_AGGRO_SPEED : ENEMY_MOVE_SPEED;
        var dx = en.moveTarget.x - en.group.position.x;
        var dz = en.moveTarget.z - en.group.position.z;
        var d = Math.hypot(dx, dz);
        if (d < 0.3) {
          en.moveTarget = null;
        } else {
          var step = Math.min(moveSpeed * dt, d);
          var nx = en.group.position.x + (dx / d) * step;
          var nz = en.group.position.z + (dz / d) * step;
          if (isClear(nx, nz, 0.5)) {
            en.group.position.x = nx;
            en.group.position.z = nz;
            en.group.rotation.y = Math.atan2(-dx, -dz);
          } else {
            en.moveTarget = null; // 撞到障碍就放弃这次目标，下次重新挑
          }
        }
      }
    }
  }

  /* ---------------- 骨骼动画播放 + 命中判定盒跟随骨骼位置 ---------------- */
  var __hitboxWorldPos = new THREE.Vector3();
  // fire / reload / prone_turn 都是"播一次就完事"的动作，正在播的时候不要被下面的走跑待机逻辑打断；
  // jump 不放在这里——它的收尾由物理落地（playerJumping 变 false）直接决定，不受动作片段自身时长限制，
  // 不然片段比实际滞空时间长的话，人物明明已经落地了，画面还在悬空播完剩下的跳跃动作才切回跑动
  function isOneShotActive(st) {
    var name = st.current;
    if (name !== "fire" && name !== "reload" && name !== "prone_turn") return false;
    var act = st.actions[name];
    if (!act) return false;
    return act.isRunning() && act.time < act.getClip().duration - 0.03;
  }
  function triggerFireAnim(st) {
    if (!st || !st.actions.fire) return;
    playAction(st, "fire", { once: true, fade: 0.05 });
  }
  function triggerReloadAnim(st) {
    if (!st || !st.actions.reload) return;
    playAction(st, "reload", { once: true, fade: 0.1 });
    var dur = st.actions.reload.getClip().duration;
    st.actions.reload.setEffectiveTimeScale(dur / (RELOAD_MS / 1000)); // 把装弹动作时长对齐到实际装弹耗时
  }

  function updateEnemyAnimState(en, now) {
    var st = en.animState;
    if (!st) return;
    if (isOneShotActive(st)) return;
    var moving = !!en.moveTarget;

    if (moving) {
      var moveName = en.aggro && st.actions.run ? "run" : (st.actions.walk ? "walk" : (st.actions.run ? "run" : "crouchRun"));
      playAction(st, moveName);
      if (st.actions[moveName]) st.actions[moveName].paused = false;
      st.nextProneAt = now + rr(5000, 11000);
      return;
    }

    // 静止：播放待机动作，偶尔穿插一次俯卧转身增加变化
    playAction(st, st.actions.idle ? "idle" : "crouchRun");
    if (st.nextProneAt === undefined) st.nextProneAt = now + rr(3000, 8000);
    if (now > st.nextProneAt && st.actions.prone_turn) {
      playAction(st, "prone_turn", { once: true, fade: 0.15 });
    }
  }

  function updatePlayerAnimState() {
    var st = playerAnimState;
    if (!st) return;
    if (playerJumping) {
      if (st.current !== "jump") playAction(st, "jump", { once: true, fade: 0.1 });
      return;
    }
    if (isOneShotActive(st)) return;
    var desired = !playerMoving ? "idle" : playerSpeedTier;
    if (!st.actions[desired]) desired = st.actions.idle ? "idle" : (st.actions.run ? "run" : "crouchRun");
    playAction(st, desired);
    if (desired === "walk" || desired === "run") st.actions[desired].paused = false;
  }

  // 每帧只对每个敌人的骨架做一次 updateMatrixWorld，再直接读取骨骼矩阵算判定盒世界坐标，
  // 避免对同一批祖先节点重复做世界矩阵级联更新（6 个判定盒 x 14 个敌人）
  var __hitboxMat = new THREE.Matrix4();
  function syncEnemyHitboxes(en) {
    en.group.updateMatrixWorld(true);
    for (var j = 0; j < en.parts.length; j++) {
      var p = en.parts[j];
      if (!p.bone) continue;
      __hitboxWorldPos.setFromMatrixPosition(p.bone.matrixWorld);
      __hitboxWorldPos.y += p.offsetY;
      en.group.worldToLocal(__hitboxWorldPos);
      p.mesh.position.copy(__hitboxWorldPos);
    }
  }

  function updateCharacterAnimations(dt) {
    updatePlayerAnimState();
    if (playerMixer) playerMixer.update(dt);
    if (!gameActive) return;
    var now = performance.now();
    for (var i = 0; i < enemies.length; i++) {
      var en = enemies[i];
      if (!en.mixer || en.mixerDone) continue;
      if (en.alive) {
        updateEnemyAnimState(en, now);
        en.mixer.update(dt);
        syncEnemyHitboxes(en);
      } else {
        en.mixer.update(dt); // 已死亡但死亡动画/下沉特效还没播完，继续推进骨骼动画
      }
    }
  }

  /* ---------------- 触控 / 键盘 / 指针锁定 ---------------- */
  var isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0 || window.matchMedia("(pointer: coarse)").matches;

    if (!isTouch) return;

      var orientation = screen.orientation;
      if (orientation && orientation.lock) orientation.lock("landscape").catch(function () {});

  }

  function enterGame() {
    gameActive = true;
    // 进入/恢复游戏时给敌人重新计时+宽限期，避免菜单停留期间"攒火力"导致一进场就被齐射
    var now = performance.now();
    for (var i = 0; i < enemies.length; i++) {
      if (enemies[i].alive) {

        enemies[i].nextMoveTime = now + rr(500, 1800);
      }

  /* ---------------- 局内商店：右上角随时可开，切武器/换皮肤，打开时暂停游戏 ---------------- */
  var shopOpen = false;
  function refreshShopSelection() {
    var cards = shopPanel.querySelectorAll(".weapon-card");
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.toggle("selected", cards[i].getAttribute("data-weapon") === currentWeapon.key);
    }
